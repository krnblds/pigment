<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- H: an app tile: a UV-checker ball half covered by orange paint flowing down from the top -->
  <defs>
    <pattern id="chk" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-12) skewX(-6)">
      <rect width="40" height="40" fill="#C8CBD0"/><rect width="20" height="20" fill="#5D6168"/><rect x="20" y="20" width="20" height="20" fill="#5D6168"/>
    </pattern>
    <clipPath id="b"><circle cx="128" cy="134" r="84"/></clipPath>
    <radialGradient id="sh" cx="0.38" cy="0.32" r="0.7"><stop offset="0.3" stop-color="#fff" stop-opacity="0.2"/><stop offset="0.75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB070"/><stop offset="1" stop-color="#D6742A"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2E33"/><stop offset="1" stop-color="#17181B"/></linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="51.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>
  <g clip-path="url(#b)">
    <rect x="40" y="40" width="180" height="180" fill="url(#chk)"/>
    <path fill="url(#p)" d="M40 40 H220 V128 C210 126 204 134 202 146 C200 160 186 162 184 148 C182 134 170 130 160 140 C150 150 152 184 138 184 C124 184 128 150 118 140 C108 130 98 138 96 152 C94 164 80 164 78 150 C76 136 60 128 40 132 Z"/>
    <circle cx="128" cy="134" r="84" fill="url(#sh)"/>
  </g>
  <ellipse cx="96" cy="86" rx="20" ry="10" fill="#fff" fill-opacity="0.7" transform="rotate(-30 96 86)"/>
</svg>
