# Smart model (building/building_a). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "building_a"
kind = "building"
title = "Narrow six-storey walk-up (8 x 10 m, 21 m), ground-floor shop"
family = "town kit"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "assets/blender/town/building_a.py"
args = ["assets/town/building_a.glb"]
outputs = ["assets/town/building_a.glb"]
deps = ["assets/blender/town/_kit.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "town_textures"
tool = "tools/town_textures.py"
job = "building_a"
outputs = ["scenes/town/scripts/building_a.jsonl"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/town/scripts/building_a.jsonl"]
textures = "scenes/town/textures"
resolution = 2048
variants = [
  "memory_pawn",
  "implants",
  "capsules",
  "soba",
  "dream_den",
  "evicted",
  "fixers",
  "love_hotel",
  "hostess_bar",
]
