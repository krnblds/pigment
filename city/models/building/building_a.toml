# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "building"
collision = "box"
tris = 52196
policy = "heavy"
proxy = true
world_keys = [
  "building_a__capsules",
  "building_a__dream_den",
  "building_a__evicted",
  "building_a__fixers",
  "building_a__hostess_bar",
  "building_a__implants",
  "building_a__love_hotel",
  "building_a__memory_pawn",
  "building_a__soba",
]

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 2330
source = "tools/world/placement.py"
rules = "kit frontage rows + back rows per district (world_config.json districts[].kit); a random Pigment variant per instance, never the same as the previous one"
districts = { downtown = 166, hillside = 426, midtown = 1077, old_town = 500, yoimachi = 161 }

[placement.variant_counts]
capsules = 331
dream_den = 323
evicted = 335
fixers = 322
implants = 320
memory_pawn = 311
soba = 329
