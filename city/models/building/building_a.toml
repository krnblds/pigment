# Smart model (building/building_a). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "building_a"
kind = "building"
title = "Narrow six-storey walk-up (8 x 10 m, 21 m), ground-floor shop"
family = "town kit"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "assets/blender/town/building_a.py"
args = ["assets/town/building_a.glb"]
outputs = ["assets/town/building_a.glb"]
deps = ["assets/blender/town/_kit.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "town_textures"
tool = "tools/town_textures.py"
job = "building_a"
outputs = ["scenes/town/scripts/building_a.jsonl"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/town/scripts/building_a.jsonl"]
textures = "scenes/town/textures"
resolution = 2048
variants = ["memory_pawn", "implants", "capsules", "soba", "dream_den", "evicted", "fixers"]
decals = [
  "assets/decals/story/billboard_defaced.png",
  "assets/decals/story/billboard_dreamlink.png",
  "assets/decals/story/billboard_jobs.png",
  "assets/decals/story/billboard_meridian.png",
  "assets/decals/story/billboard_noctis.png",
  "assets/decals/story/billboard_score.png",
  "assets/decals/story/blade_capsule.png",
  "assets/decals/story/blade_gitai.png",
  "assets/decals/story/blade_kioku.png",
  "assets/decals/story/blade_pachinko.png",
  "assets/decals/story/blade_soba.png",
  "assets/decals/story/blade_yume.png",
  "assets/decals/story/graffiti_lying.png",
  "assets/decals/story/graffiti_not_data.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/graffiti_who_owns.png",
  "assets/decals/story/plate_curfew.png",
  "assets/decals/story/plate_loitering.png",
  "assets/decals/story/plate_observed.png",
  "assets/decals/story/plate_property.png",
  "assets/decals/story/poster_missing_aiko.png",
  "assets/decals/story/poster_missing_mika.png",
  "assets/decals/story/poster_missing_ren.png",
  "assets/decals/story/poster_unplug.png",
  "assets/decals/story/sign_capsule_2h.png",
  "assets/decals/story/sign_dreams.png",
  "assets/decals/story/sign_dumplings.png",
  "assets/decals/story/sign_implant_repair.png",
  "assets/decals/story/sign_memory_pawn.png",
  "assets/decals/story/sign_score_reset.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/town/projects/building_a.pigment",
  "scenes/town/textures/building_a",
  "scenes/town/textures/building_a__capsules",
  "scenes/town/textures/building_a__dream_den",
  "scenes/town/textures/building_a__evicted",
  "scenes/town/textures/building_a__fixers",
  "scenes/town/textures/building_a__implants",
  "scenes/town/textures/building_a__memory_pawn",
  "scenes/town/textures/building_a__soba",
]
patch = []

[pigment.decal_slots]
back = ["billboard_dreamlink", "billboard_jobs", "billboard_score"]
blade = ["blade_capsule", "blade_gitai", "blade_kioku", "blade_pachinko", "blade_soba", "blade_yume"]
high = [
  "billboard_defaced",
  "billboard_dreamlink",
  "billboard_jobs",
  "billboard_meridian",
  "billboard_noctis",
  "billboard_score",
]
plate = ["plate_curfew", "plate_loitering", "plate_observed"]
post_w1 = ["poster_missing_aiko", "poster_missing_mika", "poster_missing_ren", "poster_unplug"]
post_w2 = ["poster_missing_aiko", "poster_missing_ren", "poster_unplug"]
shop = [
  "plate_property",
  "sign_capsule_2h",
  "sign_dreams",
  "sign_dumplings",
  "sign_implant_repair",
  "sign_memory_pawn",
  "sign_score_reset",
]
tag_e = ["graffiti_unplug", "graffiti_who_owns", "stencil_eye_crossed"]
tag_w = ["graffiti_lying", "graffiti_not_data", "graffiti_who_owns", "stencil_eye_crossed"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "building"
collision = "box"
tris = 46774
policy = "heavy"
proxy = true
world_keys = [
  "building_a__capsules",
  "building_a__dream_den",
  "building_a__evicted",
  "building_a__fixers",
  "building_a__implants",
  "building_a__memory_pawn",
  "building_a__soba",
]

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 2271
source = "tools/world/placement.py"
rules = "kit frontage rows + back rows per district (world_config.json districts[].kit); a random Pigment variant per instance, never the same as the previous one"
districts = { downtown = 161, hillside = 415, midtown = 1196, old_town = 499 }

[placement.variant_counts]
capsules = 331
dream_den = 323
evicted = 335
fixers = 322
implants = 320
memory_pawn = 311
soba = 329
