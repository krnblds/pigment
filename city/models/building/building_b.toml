# Smart model (building/building_b). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "building_b"
kind = "building"
title = "Four-bay shophouse block (16 x 12 m)"
family = "town kit"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "assets/blender/town/building_b.py"
args = ["assets/town/building_b.glb"]
outputs = ["assets/town/building_b.glb"]
deps = ["assets/blender/town/_kit.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "town_textures"
tool = "tools/town_textures.py"
job = "building_b"
outputs = ["scenes/town/scripts/building_b.jsonl"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/town/scripts/building_b.jsonl"]
textures = "scenes/town/textures"
resolution = 2048
variants = ["noodle_row", "body_shop", "dream_strip", "score_fixers", "pawn_row", "seized", "night_market"]
decals = [
  "assets/decals/story/billboard_defaced.png",
  "assets/decals/story/billboard_dreamlink.png",
  "assets/decals/story/billboard_jobs.png",
  "assets/decals/story/billboard_meridian.png",
  "assets/decals/story/billboard_noctis.png",
  "assets/decals/story/billboard_score.png",
  "assets/decals/story/graffiti_lying.png",
  "assets/decals/story/graffiti_not_data.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/graffiti_who_owns.png",
  "assets/decals/story/plate_curfew.png",
  "assets/decals/story/plate_loitering.png",
  "assets/decals/story/plate_observed.png",
  "assets/decals/story/plate_property.png",
  "assets/decals/story/poster_missing_aiko.png",
  "assets/decals/story/poster_missing_mika.png",
  "assets/decals/story/poster_missing_ren.png",
  "assets/decals/story/poster_unplug.png",
  "assets/decals/story/sign_capsule_2h.png",
  "assets/decals/story/sign_charge.png",
  "assets/decals/story/sign_clinic.png",
  "assets/decals/story/sign_dreams.png",
  "assets/decals/story/sign_dumplings.png",
  "assets/decals/story/sign_implant_repair.png",
  "assets/decals/story/sign_jailbreak.png",
  "assets/decals/story/sign_karaoke.png",
  "assets/decals/story/sign_memory_pawn.png",
  "assets/decals/story/sign_offgrid.png",
  "assets/decals/story/sign_organ_credit.png",
  "assets/decals/story/sign_score_reset.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/town/projects/building_b.pigment",
  "scenes/town/textures/building_b",
  "scenes/town/textures/building_b__body_shop",
  "scenes/town/textures/building_b__dream_strip",
  "scenes/town/textures/building_b__night_market",
  "scenes/town/textures/building_b__noodle_row",
  "scenes/town/textures/building_b__pawn_row",
  "scenes/town/textures/building_b__score_fixers",
  "scenes/town/textures/building_b__seized",
]
patch = []

[pigment.decal_slots]
back = ["graffiti_lying", "graffiti_unplug"]
bay1 = [
  "sign_clinic",
  "sign_dreams",
  "sign_dumplings",
  "sign_implant_repair",
  "sign_memory_pawn",
  "sign_organ_credit",
  "sign_score_reset",
]
bay2 = [
  "sign_capsule_2h",
  "sign_jailbreak",
  "sign_karaoke",
  "sign_offgrid",
  "sign_organ_credit",
  "sign_score_reset",
]
bay3 = [
  "plate_property",
  "sign_capsule_2h",
  "sign_charge",
  "sign_clinic",
  "sign_dumplings",
  "sign_implant_repair",
  "sign_karaoke",
]
bay4 = [
  "sign_charge",
  "sign_clinic",
  "sign_dreams",
  "sign_jailbreak",
  "sign_memory_pawn",
  "sign_offgrid",
  "sign_organ_credit",
]
plate = ["plate_curfew", "plate_loitering", "plate_observed", "plate_property"]
post_w1 = ["poster_missing_aiko", "poster_missing_mika", "poster_missing_ren", "poster_unplug"]
post_w2 = ["poster_missing_mika", "poster_missing_ren"]
roof = [
  "billboard_defaced",
  "billboard_dreamlink",
  "billboard_jobs",
  "billboard_meridian",
  "billboard_noctis",
  "billboard_score",
]
tag_e = ["graffiti_unplug", "graffiti_who_owns", "stencil_eye_crossed"]
tag_w = ["graffiti_lying", "graffiti_not_data", "graffiti_who_owns", "stencil_eye_crossed"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "building"
collision = "box"
tris = 40470
policy = "heavy"
proxy = true
world_keys = [
  "building_b__body_shop",
  "building_b__dream_strip",
  "building_b__night_market",
  "building_b__noodle_row",
  "building_b__pawn_row",
  "building_b__score_fixers",
  "building_b__seized",
]

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 1452
source = "tools/world/placement.py"
rules = "kit frontage rows + back rows per district (world_config.json districts[].kit); a random Pigment variant per instance, never the same as the previous one"
districts = { downtown = 104, hillside = 173, midtown = 926, old_town = 249 }

[placement.variant_counts]
body_shop = 200
dream_strip = 225
night_market = 204
noodle_row = 205
pawn_row = 199
score_fixers = 222
seized = 197
