# Smart model (building/building_c). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "building_c"
kind = "building"
title = "Corporate tower (building_c), crown billboards"
family = "town kit"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "assets/blender/town/building_c.py"
args = ["assets/town/building_c.glb"]
outputs = ["assets/town/building_c.glb"]
deps = ["assets/blender/town/_kit.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "town_textures"
tool = "tools/town_textures.py"
job = "building_c"
outputs = ["scenes/town/scripts/building_c.jsonl"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/town/scripts/building_c.jsonl"]
textures = "scenes/town/textures"
resolution = 4096
variants = ["hoshikawa_hq", "meridian", "dreamlink", "platinum", "showroom"]
decals = [
  "assets/decals/ads/billboard_ad_attention_market.png",
  "assets/decals/ads/billboard_ad_hoshikawa_home.png",
  "assets/decals/ads/billboard_ad_hoshikawa_secure.png",
  "assets/decals/ads/billboard_ad_kagerou_watch.png",
  "assets/decals/ads/billboard_ad_kanzaki_hayate.png",
  "assets/decals/ads/billboard_ad_meridian_future.png",
  "assets/decals/ads/billboard_ad_meridian_platinum.png",
  "assets/decals/ads/billboard_ad_platinum_defaced.png",
  "assets/decals/logo_hoshikawa_dynamics.png",
  "assets/decals/story/billboard_defaced.png",
  "assets/decals/story/billboard_dreamlink.png",
  "assets/decals/story/billboard_jobs.png",
  "assets/decals/story/billboard_meridian.png",
  "assets/decals/story/billboard_noctis.png",
  "assets/decals/story/billboard_score.png",
  "assets/decals/story/graffiti_lying.png",
  "assets/decals/story/graffiti_not_data.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/graffiti_who_owns.png",
  "assets/decals/story/plate_curfew.png",
  "assets/decals/story/plate_observed.png",
  "assets/decals/story/plate_property.png",
  "assets/decals/story/sign_hoshikawa_security.png",
  "assets/decals/story/sign_meridian_kiosk.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/town/projects/building_c.pigment",
  "scenes/town/textures/building_c",
  "scenes/town/textures/building_c__dreamlink",
  "scenes/town/textures/building_c__hoshikawa_hq",
  "scenes/town/textures/building_c__meridian",
  "scenes/town/textures/building_c__platinum",
  "scenes/town/textures/building_c__showroom",
]
patch = []

[pigment.decal_slots]
band = ["sign_hoshikawa_security", "sign_meridian_kiosk"]
crown_e = [
  "billboard_ad_kagerou_watch",
  "billboard_ad_meridian_future",
  "billboard_meridian",
  "billboard_noctis",
  "billboard_score",
]
crown_n = [
  "billboard_ad_kanzaki_hayate",
  "billboard_ad_meridian_platinum",
  "billboard_dreamlink",
  "billboard_meridian",
  "billboard_score",
]
crown_s = [
  "billboard_ad_hoshikawa_home",
  "billboard_ad_hoshikawa_secure",
  "billboard_dreamlink",
  "billboard_jobs",
  "billboard_meridian",
]
crown_w = [
  "billboard_ad_attention_market",
  "billboard_ad_platinum_defaced",
  "billboard_defaced",
  "billboard_jobs",
  "billboard_meridian",
]
lobby = ["logo_hoshikawa_dynamics"]
plate = ["plate_curfew", "plate_observed", "plate_property"]
tag_e = ["graffiti_lying", "graffiti_unplug", "graffiti_who_owns"]
tag_w = ["graffiti_not_data", "stencil_eye_crossed"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "building"
collision = "box"
tris = 61860
policy = "heavy"
proxy = true
world_keys = [
  "building_c__dreamlink",
  "building_c__hoshikawa_hq",
  "building_c__meridian",
  "building_c__platinum",
  "building_c__showroom",
]

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 755
source = "tools/world/placement.py"
rules = "kit frontage rows + back rows per district (world_config.json districts[].kit); a random Pigment variant per instance, never the same as the previous one"
districts = { corporate = 85, downtown = 247, hillside = 46, midtown = 264, old_town = 113 }
variant_counts = { dreamlink = 255, hoshikawa_hq = 229, meridian = 250 }
