# Smart model (decal_set/props). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "props"
kind = "decal_set"
title = "Street-prop decals: screens, ads, stickers, menus"
family = "decals"
derived = ["decals.images", "decals.used_by", "game.images"]

