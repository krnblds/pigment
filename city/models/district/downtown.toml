# Smart model (district/downtown). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "downtown"
kind = "district"
title = "District downtown (downtown)"
family = "world"
derived = ["district.counts", "district.settings"]

[district]
world = "world/shinkai_bay"
island = "shinkai"
counts = { buildings = 527, towers = 150 }

[district.settings]
name = "downtown"
island = "shinkai"
center = [-120, -150]
radius = 420
style = "downtown"
back_rows = 0.9
crown_ads = [
  "billboard_ad_meridian_platinum",
  "billboard_ad_meridian_future",
  "billboard_ad_hoshikawa_limbs",
  "billboard_ad_hoshikawa_home",
  "billboard_ad_hoshikawa_secure",
  "billboard_ad_kagerou_watch",
  "billboard_ad_kanzaki_hayate",
  "billboard_ad_dreamlink_premium",
  "billboard_ad_noctis_firstkiss",
  "billboard_ad_attention_market",
  "billboard_ad_organsure",
  "billboard_ad_sakura_credit",
  "billboard_ad_capsule_estate",
  "billboard_ad_breathe_plus",
  "billboard_ad_volt_rush",
  "billboard_ad_platinum_defaced",
]
kit = { building_c = 3, building_a = 1, building_b = 1 }

[district.settings.towers]
density = 0.55
height = [70, 230]

[district.settings.variant_weights]
building_c = { platinum = 3, showroom = 3 }
building_a = { implants = 2, capsules = 2, love_hotel = 0, hostess_bar = 0 }
building_b = { pawn_row = 2, night_market = 2, cabaret_row = 0, hostess_row = 0 }
bus_stop = { platinum = 3, hayate = 3, breathe = 2, volt = 2 }
holo_pylon = { sale = 4, volt = 2 }
data_kiosk = { platinum = 3, loan = 2, attention = 2 }

# Deep-merged into tools/world/world_config.json before the world is generated.
[config]
