# Smart model (district/hillside). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "hillside"
kind = "district"
title = "District hillside (hillside)"
family = "world"
derived = ["district.counts", "district.settings"]

[district]
world = "world/shinkai_bay"
island = "kagero_hills"
counts = { buildings = 624 }

[district.settings]
name = "hillside"
island = "kagero_hills"
style = "hillside"
back_rows = 0.5
spread = 4.0
kit = { building_a = 3, building_b = 2, building_c = 0.5 }

# Deep-merged into tools/world/world_config.json before the world is generated.
[config]
