# Smart model (district/midtown). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "midtown"
kind = "district"
title = "District midtown (dense)"
family = "world"
derived = ["district.counts", "district.settings"]

[district]
world = "world/shinkai_bay"
island = "shinkai"
counts = { buildings = 2130, towers = 64 }

[district.settings]
name = "midtown"
island = "shinkai"
center = [-120, -150]
radius = 900
style = "dense"
back_rows = 0.85
kit = { building_a = 3, building_b = 3, building_c = 1 }

[district.settings.towers]
density = 0.08
height = [45, 90]

# Deep-merged into tools/world/world_config.json before the world is generated.
[config]
