# Smart model (district/old_town). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "old_town"
kind = "district"
title = "District old_town (dense)"
family = "world"
derived = ["district.counts", "district.settings"]

[district]
world = "world/shinkai_bay"
island = "shinkai"
counts = { buildings = 848 }

[district.settings]
name = "old_town"
island = "shinkai"
center = [-120, -150]
radius = 9999
style = "dense"
back_rows = 0.6
towers = { density = 0.0 }
kit = { building_a = 3, building_b = 2, building_c = 1 }

# Deep-merged into tools/world/world_config.json before the world is generated.
[config]
