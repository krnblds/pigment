# Smart model (district/yoimachi). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "yoimachi"
kind = "district"
title = "District yoimachi (dense)"
family = "world"
derived = ["district.counts", "district.settings"]

[district]
world = "world/shinkai_bay"
island = "shinkai"
counts = { buildings = 267 }

[district.settings]
name = "yoimachi"
island = "shinkai"
center = [-720, -120]
radius = 190
style = "dense"
back_rows = 0.85
note = "宵町 Yoimachi: the red-light / entertainment district (love hotels, hostess bars, cabaret row), 200 m west of the spawn"
towers = { density = 0.0 }
kit = { building_a = 3, building_b = 3 }

[district.settings.variant_weights]
building_b = { cabaret_row = 7, hostess_row = 7, dream_strip = 1, seized = 0.3, body_shop = 0.3 }
overhead_sign = { welcome = 2, velvet_moon = 5, peep_show = 5, snack = 5, karaoke = 2, capsule = 1 }
bus_stop = { dolls = 4, velvet_moon = 4, intimate = 3, matcha = 2 }
holo_pylon = { hotel = 5, dolls = 5, sale = 1 }
data_kiosk = { match = 4, loan = 2, attention = 1 }

[district.settings.variant_weights.building_a]
love_hotel = 7
hostess_bar = 7
evicted = 0.5
implants = 0.3
capsules = 1
dream_den = 1

# Deep-merged into tools/world/world_config.json before the world is generated.
[config]
