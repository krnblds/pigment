# Smart model (prop/ac_unit). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "ac_unit"
kind = "prop"
title = "Air-con condenser on a stand"
family = "street props kit"
category = "rooftop"
description = "Split-system condenser with a perforated fan grille on a galvanised stand, refrigerant pipes and drain hose."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["ac_unit"]
outputs = ["assets/props/src/ac_unit.glb", "assets/props/src/ac_unit.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["ac_unit", "--no-run"]
outputs = ["scenes/props/scripts/ac_unit.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/ac_unit.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["white", "graphite"]
decals = ["assets/decals/props/ac_brand.png", "assets/decals/story/stencil_eye_crossed.png"]
outputs = [
  "scenes/props/projects/ac_unit.pigment",
  "scenes/props/textures/ac_unit",
  "scenes/props/textures/ac_unit__graphite",
  "scenes/props/textures/ac_unit__white",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["ac_unit", "--no-index"]
outputs = ["assets/props/ac_unit.glb", "assets/props/src/ac_unit_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 756
policy = "cell"
proxy = false
world_keys = ["PROP_ac_unit", "PROP_ac_unit__graphite", "PROP_ac_unit__white"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["BLEND"]
lod = { lod0_tris = 756, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 803
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { corporate = 84, downtown = 399, midtown = 320 }

[placement.scatter]
slots = ["rooftop", "alley"]
offset = 0.35
spacing = 1.2
clearance = 0.6
facing = "random"
yaw_jitter = 0
cluster = [1, 4]
cluster_radius = 0.0
cluster_line = true
cluster_gap = 0.95
density = { default = 1.2, residential = 2.0, slum = 2.0, market = 2.0 }
