# Smart model (prop/bench). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "bench"
kind = "prop"
title = "Anti-sleep bench"
family = "street props kit"
category = "street_furniture"
description = "1.8 m cast-iron and slat bench with a centre divider (so nobody can lie on it)."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["bench"]
outputs = ["assets/props/src/bench.glb", "assets/props/src/bench.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["bench", "--no-run"]
outputs = ["scenes/props/scripts/bench.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/bench.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["teal", "red"]
decals = ["assets/decals/props/bench_plaque.png", "assets/decals/story/graffiti_not_data.png"]
outputs = [
  "scenes/props/projects/bench.pigment",
  "scenes/props/textures/bench",
  "scenes/props/textures/bench__red",
  "scenes/props/textures/bench__teal",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["bench", "--no-index"]
outputs = ["assets/props/bench.glb", "assets/props/src/bench_export.json", "assets/props/bench_lod1.glb"]
embed = 512
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 672
policy = "cell"
proxy = false
world_keys = ["PROP_bench", "PROP_bench__red", "PROP_bench__teal"]
visible_to_m = 150.0
collider = "compound"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 672, lod1_tris = 336, lod1_from_m = 20.0, visible_to_m = 81.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 392
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 21
downtown = 110
hillside = 85
midtown = 135
old_town = 22
port = 9
yoimachi = 10

[placement.scatter]
slots = ["walk", "frontage", "plaza"]
offset = 0.6
spacing = 10.0
clearance = 1.1
facing = "road"
yaw_jitter = 0

[placement.scatter.density]
default = 1.0
luxury = 2.0
residential = 1.5
downtown = 1.5
industrial = 0.2
market = 0.5
