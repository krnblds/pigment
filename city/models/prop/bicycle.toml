# Smart model (prop/bicycle). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "bicycle"
kind = "prop"
title = "City bicycle"
family = "street props kit"
category = "clutter"
description = "Step-through city bike on its kickstand with a front basket."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["bicycle"]
outputs = ["assets/props/src/bicycle.glb", "assets/props/src/bicycle.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["bicycle", "--no-run"]
outputs = ["scenes/props/scripts/bicycle.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/bicycle.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["teal", "black", "pink"]
decals = []
outputs = [
  "scenes/props/projects/bicycle.pigment",
  "scenes/props/textures/bicycle",
  "scenes/props/textures/bicycle__black",
  "scenes/props/textures/bicycle__pink",
  "scenes/props/textures/bicycle__teal",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["bicycle", "--no-index"]
outputs = [
  "assets/props/bicycle.glb",
  "assets/props/src/bicycle_export.json",
  "assets/props/bicycle_lod1.glb",
]
embed = 512
lod1_ratio = 0.4

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 3504
policy = "cell"
proxy = false
world_keys = ["PROP_bicycle", "PROP_bicycle__black", "PROP_bicycle__pink", "PROP_bicycle__teal"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["BLEND"]
lod = { lod0_tris = 3504, lod1_tris = 1401, lod1_from_m = 20.0, visible_to_m = 77.6 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 1563
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 21
downtown = 134
hillside = 515
midtown = 427
old_town = 263
port = 89
yoimachi = 114

[placement.scatter]
slots = ["frontage", "curb", "alley"]
offset = 0.5
spacing = 2.0
clearance = 0.4
facing = "along"
yaw_jitter = 8
cluster = [1, 4]
cluster_radius = 0.0
cluster_line = true
cluster_gap = 0.7

[placement.scatter.density]
default = 1.0
residential = 3.0
market = 2.0
slum = 1.5
downtown = 0.5
luxury = 0.3
