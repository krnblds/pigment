# Smart model (prop/bollard). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "bollard"
kind = "prop"
title = "Steel bollard with LED ring"
family = "street props kit"
category = "street_furniture"
description = "0.95 m domed steel bollard, retro-reflective band and a cyan LED ring."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["bollard"]
outputs = ["assets/props/src/bollard.glb", "assets/props/src/bollard.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = { height = 0.96 }

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["bollard", "--no-run"]
outputs = ["scenes/props/scripts/bollard.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/bollard.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["yellow", "pearl", "tagged"]
decals = [
  "assets/decals/props/bollard_plate.png",
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/story/graffiti_unplug.png",
]
outputs = [
  "scenes/props/projects/bollard.pigment",
  "scenes/props/textures/bollard",
  "scenes/props/textures/bollard__pearl",
  "scenes/props/textures/bollard__tagged",
  "scenes/props/textures/bollard__yellow",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["bollard", "--no-index"]
outputs = ["assets/props/bollard.glb", "assets/props/src/bollard_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1104
policy = "cell"
proxy = false
world_keys = ["PROP_bollard", "PROP_bollard__pearl", "PROP_bollard__tagged", "PROP_bollard__yellow"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = [
  { name = "Light_Ring", type = "omni", color = [0.1, 0.9, 1.0], energy = 0.4, range = 1.5 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 1104, lod1_tris = 552, lod1_from_m = 20.0, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 4104
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 232
downtown = 1305
hillside = 466
midtown = 1394
old_town = 386
port = 170
yoimachi = 151

[placement.scatter]
slots = ["curb", "corner"]
offset = -0.35
spacing = 1.6
clearance = 0.25
facing = "road"
yaw_jitter = 0
along = [0.3, 4.0]
cluster = [2, 5]
cluster_radius = 1.6
cluster_line = true

[placement.scatter.density]
default = 2.5
downtown = 5.0
luxury = 5.0
commercial = 3.0
slum = 0.5
industrial = 1.5
