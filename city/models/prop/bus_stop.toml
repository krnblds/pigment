# Smart model (prop/bus_stop). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "bus_stop"
kind = "prop"
title = "Bus shelter with lightbox ad"
family = "street props kit"
category = "street_furniture"
description = "4 m shelter: glass back wall, double-sided backlit ad box (Noctis / Dreamlink / MERIDIAN / Hoshikawa ads as variants), bench with anti-sleep dividers, route flag, timetable screen, LED strip under the roof."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["bus_stop"]
outputs = ["assets/props/src/bus_stop.glb", "assets/props/src/bus_stop.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["bus_stop", "--no-run"]
outputs = ["scenes/props/scripts/bus_stop.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/bus_stop.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = [
  "dreamlink",
  "meridian",
  "security",
  "defaced",
  "dolls",
  "velvet_moon",
  "intimate",
  "matcha",
  "platinum",
  "hayate",
  "breathe",
  "volt",
  "ramen",
]
decals = [
  "assets/decals/ads/lightbox_breathe_plus.png",
  "assets/decals/ads/lightbox_dolls.png",
  "assets/decals/ads/lightbox_hayate.png",
  "assets/decals/ads/lightbox_intimate.png",
  "assets/decals/ads/lightbox_matcha.png",
  "assets/decals/ads/lightbox_platinum.png",
  "assets/decals/ads/lightbox_ramen_kira.png",
  "assets/decals/ads/lightbox_velvet_moon.png",
  "assets/decals/ads/lightbox_volt_rush.png",
  "assets/decals/props/ad_defaced.png",
  "assets/decals/props/ad_dreamlink.png",
  "assets/decals/props/ad_meridian.png",
  "assets/decals/props/ad_noctis.png",
  "assets/decals/props/ad_security.png",
  "assets/decals/props/bus_route_flag.png",
  "assets/decals/props/bus_timetable.png",
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/poster_missing_aiko.png",
  "assets/decals/story/poster_unplug.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/props/projects/bus_stop.pigment",
  "scenes/props/textures/bus_stop",
  "scenes/props/textures/bus_stop__breathe",
  "scenes/props/textures/bus_stop__defaced",
  "scenes/props/textures/bus_stop__dolls",
  "scenes/props/textures/bus_stop__dreamlink",
  "scenes/props/textures/bus_stop__hayate",
  "scenes/props/textures/bus_stop__intimate",
  "scenes/props/textures/bus_stop__matcha",
  "scenes/props/textures/bus_stop__meridian",
  "scenes/props/textures/bus_stop__platinum",
  "scenes/props/textures/bus_stop__ramen",
  "scenes/props/textures/bus_stop__security",
  "scenes/props/textures/bus_stop__velvet_moon",
  "scenes/props/textures/bus_stop__volt",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["bus_stop", "--no-index"]
outputs = [
  "assets/props/bus_stop.glb",
  "assets/props/src/bus_stop_export.json",
  "assets/props/bus_stop_lod1.glb",
]
embed = 1024
lod1_ratio = 0.4

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1210
policy = "cell"
proxy = false
world_keys = [
  "PROP_bus_stop",
  "PROP_bus_stop__breathe",
  "PROP_bus_stop__defaced",
  "PROP_bus_stop__dolls",
  "PROP_bus_stop__dreamlink",
  "PROP_bus_stop__hayate",
  "PROP_bus_stop__intimate",
  "PROP_bus_stop__matcha",
  "PROP_bus_stop__meridian",
  "PROP_bus_stop__platinum",
  "PROP_bus_stop__security",
  "PROP_bus_stop__volt",
]
visible_to_m = 150.0
collider = "compound"
mount = "ground"
lights = [
  { name = "Light_Shelter", type = "omni", color = [0.85, 0.92, 1.0], energy = 60, range = 6.0 },
  { name = "Light_Ad", type = "omni", color = [1.0, 0.6, 0.9], energy = 25, range = 4.0 },
]
alpha = ["BLEND"]
lod = { lod0_tris = 1210, lod1_tris = 484, lod1_from_m = 39.8, visible_to_m = 198.9 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 56
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 1
downtown = 14
hillside = 7
midtown = 24
old_town = 3
port = 6
yoimachi = 1

[placement.scatter]
slots = ["curb"]
offset = -0.9
spacing = 120.0
clearance = 2.6
facing = "road"
yaw_jitter = 0

[placement.scatter.density]
default = 0.4
downtown = 0.6
commercial = 0.6
residential = 0.4
slum = 0.2
market = 0.2
luxury = 0.4
