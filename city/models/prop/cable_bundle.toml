# Smart model (prop/cable_bundle). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "cable_bundle"
kind = "prop"
title = "Overhead cable bundle (8 m span)"
family = "street props kit"
category = "utility"
description = "Four sagging cables with clamps and a hanging junction box, spanning 8 m between two walls at ~5.5 m. Scale X to the gap."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["cable_bundle"]
outputs = ["assets/props/src/cable_bundle.glb", "assets/props/src/cable_bundle.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["cable_bundle", "--no-run"]
outputs = ["scenes/props/scripts/cable_bundle.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/cable_bundle.jsonl"]
textures = "scenes/props/textures"
resolution = 512
variants = []
decals = ["assets/decals/props/junction_tag.png"]
outputs = ["scenes/props/projects/cable_bundle.pigment", "scenes/props/textures/cable_bundle"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["cable_bundle", "--no-index"]
outputs = ["assets/props/cable_bundle.glb", "assets/props/src/cable_bundle_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
collider = "none"
mount = "span"
lights = []
alpha = ["OPAQUE"]
category = "utility"
lod = { lod0_tris = 1532, visible_to_m = 361.8 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = {}

[placement.scatter]
slots = ["alley_span"]
spacing = 3.0
clearance = 0.0
facing = "along"
yaw_jitter = 0
mount_height = [4.5, 7.5]

[placement.scatter.density]
default = 4.0
slum = 10.0
market = 8.0
commercial = 5.0
luxury = 0.0
downtown = 1.0
