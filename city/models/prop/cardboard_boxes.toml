# Smart model (prop/cardboard_boxes). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "cardboard_boxes"
kind = "prop"
title = "Cardboard box stack"
family = "street props kit"
category = "clutter"
description = "Three taped boxes with Hoshikawa Logistics print and FRAGILE labels."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["cardboard_boxes"]
outputs = ["assets/props/src/cardboard_boxes.glb", "assets/props/src/cardboard_boxes.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["cardboard_boxes", "--no-run"]
outputs = ["scenes/props/scripts/cardboard_boxes.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/cardboard_boxes.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = []
decals = ["assets/decals/props/box_fragile.png", "assets/decals/props/box_logistics.png"]
outputs = ["scenes/props/projects/cardboard_boxes.pigment", "scenes/props/textures/cardboard_boxes"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["cardboard_boxes", "--no-index"]
outputs = ["assets/props/cardboard_boxes.glb", "assets/props/src/cardboard_boxes_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 216
policy = "cell"
proxy = false
world_keys = ["PROP_cardboard_boxes"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 216, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 256
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { downtown = 9, hillside = 32, midtown = 79, old_town = 79, port = 57 }

[placement.scatter]
slots = ["frontage", "alley"]
offset = 0.4
spacing = 5.0
clearance = 0.7
facing = "random"
yaw_jitter = 25

[placement.scatter.density]
default = 1.0
market = 4.0
slum = 4.0
industrial = 3.0
luxury = 0.0
downtown = 0.2
