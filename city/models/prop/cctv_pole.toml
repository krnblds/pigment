# Smart model (prop/cctv_pole). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "cctv_pole"
kind = "prop"
title = "MERIDIAN surveillance pole"
family = "street props kit"
category = "utility"
description = "5.5 m pole, cross-arm with three bullet cameras (red eye LEDs) and a dome camera, junction box with a MERIDIAN plate, solar panel."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["cctv_pole"]
outputs = ["assets/props/src/cctv_pole.glb", "assets/props/src/cctv_pole.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["cctv_pole", "--no-run"]
outputs = ["scenes/props/scripts/cctv_pole.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/cctv_pole.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["clean"]
decals = [
  "assets/decals/props/meridian_plate.png",
  "assets/decals/story/poster_unplug.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/props/projects/cctv_pole.pigment",
  "scenes/props/textures/cctv_pole",
  "scenes/props/textures/cctv_pole__clean",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["cctv_pole", "--no-index"]
outputs = [
  "assets/props/cctv_pole.glb",
  "assets/props/src/cctv_pole_export.json",
  "assets/props/cctv_pole_lod1.glb",
]
embed = 512
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1526
policy = "cell"
proxy = false
world_keys = ["PROP_cctv_pole", "PROP_cctv_pole__clean"]
visible_to_m = 150.0
collider = "compound"
mount = "ground"
lights = [
  { name = "Light_Eye_0", type = "omni", color = [1.0, 0.08, 0.08], energy = 0.25, range = 0.8 },
  { name = "Light_Eye_1", type = "omni", color = [1.0, 0.08, 0.08], energy = 0.25, range = 0.8 },
  { name = "Light_Eye_2", type = "omni", color = [1.0, 0.08, 0.08], energy = 0.25, range = 0.8 },
]
alpha = ["BLEND"]
lod = { lod0_tris = 1526, lod1_tris = 763, lod1_from_m = 51.3, visible_to_m = 256.7 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 304
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 10
downtown = 100
hillside = 42
midtown = 109
old_town = 24
port = 11
yoimachi = 8

[placement.scatter]
slots = ["corner", "curb", "plaza"]
offset = -0.5
along = [3.0, 6.0]
spacing = 35.0
clearance = 0.6
facing = "road"
yaw_jitter = 25
density = { default = 0.5, downtown = 1.5, commercial = 0.8, slum = 0.6, luxury = 0.8 }
