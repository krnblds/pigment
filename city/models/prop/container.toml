# Smart model (prop/container). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "container"
kind = "prop"
title = "ISO 40' dry container"
family = "street props kit"
category = "port"
description = "12.19 x 2.44 x 2.59 m steel box: trapezoidal corrugated sides, roof and front wall, corner castings, rails, cross members, ribbed doors with four lock rods, cams, handles and hinges, CSC plate. Long axis X, doors at +X (glTF). Stacks at 2.6 m. Variants are the yard colours (rust, blue, white, green, orange, grey, teal), each with its own line's livery."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["container"]
outputs = ["assets/props/src/container.glb", "assets/props/src/container.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["container", "--no-run"]
outputs = ["scenes/props/scripts/container.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/container.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = ["blue", "white", "green", "orange", "grey", "teal"]
decals = [
  "assets/decals/props/container_code_blue.png",
  "assets/decals/props/container_code_green.png",
  "assets/decals/props/container_code_grey.png",
  "assets/decals/props/container_code_orange.png",
  "assets/decals/props/container_code_rust.png",
  "assets/decals/props/container_code_teal.png",
  "assets/decals/props/container_code_white.png",
  "assets/decals/props/container_csc.png",
  "assets/decals/props/container_customs.png",
  "assets/decals/props/container_logo_blue.png",
  "assets/decals/props/container_logo_green.png",
  "assets/decals/props/container_logo_grey.png",
  "assets/decals/props/container_logo_orange.png",
  "assets/decals/props/container_logo_rust.png",
  "assets/decals/props/container_logo_teal.png",
  "assets/decals/props/container_logo_white.png",
  "assets/decals/props/container_weights.png",
  "assets/decals/story/graffiti_not_data.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/poster_missing_mika.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/props/projects/container.pigment",
  "scenes/props/textures/container",
  "scenes/props/textures/container__blue",
  "scenes/props/textures/container__green",
  "scenes/props/textures/container__grey",
  "scenes/props/textures/container__orange",
  "scenes/props/textures/container__teal",
  "scenes/props/textures/container__white",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["container", "--no-index"]
outputs = [
  "assets/props/container.glb",
  "assets/props/src/container_export.json",
  "assets/props/container_lod1.glb",
]
embed = 1024
lod1_ratio = 0.3

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "container"
collision = "box"
tris = 3224
policy = "cell"
proxy = false
world_keys = [
  "PROP_container",
  "PROP_container__blue",
  "PROP_container__green",
  "PROP_container__grey",
  "PROP_container__orange",
  "PROP_container__teal",
  "PROP_container__white",
]
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 3224, lod1_tris = 967, lod1_from_m = 110.4, visible_to_m = 552.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 3453
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { port = 3453 }

[placement.scatter]
slots = []
spacing = 13.0
clearance = 0.0
facing = "along"
yaw_jitter = 0
density = { default = 0.0 }
