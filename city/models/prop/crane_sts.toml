# Smart model (prop/crane_sts). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "crane_sts"
kind = "prop"
title = "Ship-to-shore gantry crane"
family = "street props kit"
category = "port"
description = "Quay crane: travel bogies on two rails 18 m apart (y = -+9 m, glTF z), four tapered legs, portal and tie beams, twin box girders with walkways and handrails, a boom reaching 64 m over the water (-z in glTF = +y Blender), A-frame with fore / back stays, machinery house with banners, trolley, glazed operator cab, ropes, headblock and spreader, stairs, cable reel."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["crane_sts"]
outputs = ["assets/props/src/crane_sts.glb", "assets/props/src/crane_sts.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["crane_sts", "--no-run"]
outputs = ["scenes/props/scripts/crane_sts.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/crane_sts.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = ["blue", "white"]
decals = [
  "assets/decals/props/crane_banner.png",
  "assets/decals/props/crane_number.png",
  "assets/decals/props/crane_warning.png",
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/poster_missing_ren.png",
]
outputs = [
  "scenes/props/projects/crane_sts.pigment",
  "scenes/props/textures/crane_sts",
  "scenes/props/textures/crane_sts__blue",
  "scenes/props/textures/crane_sts__white",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["crane_sts", "--no-index"]
outputs = [
  "assets/props/crane_sts.glb",
  "assets/props/src/crane_sts_export.json",
  "assets/props/crane_sts_lod1.glb",
]
embed = 2048
lod1_ratio = 0.35

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "crane"
collision = "trimesh"
tris = 4852
policy = "cell"
proxy = false
world_keys = ["PROP_crane_sts", "PROP_crane_sts__blue", "PROP_crane_sts__white"]
collider = "compound"
mount = "ground"
lights = [
  { name = "Light_Beacon", type = "omni", color = [1.0, 0.05, 0.02], energy = 30, range = 40 },
  { name = "Light_Boom", type = "spot", color = [1.0, 0.85, 0.65], energy = 900, range = 55 },
]
alpha = ["BLEND"]
lod = { lod0_tris = 4852, lod1_tris = 1698, lod1_from_m = 828.0, visible_to_m = 4140.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 40
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { port = 40 }

[placement.scatter]
slots = []
spacing = 40.0
clearance = 0.0
facing = "along"
yaw_jitter = 0
density = { default = 0.0 }
