# Smart model (prop/crash_barrier). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "crash_barrier"
kind = "prop"
title = "Water-filled plastic crash barrier"
family = "street props kit"
category = "traffic"
description = "1.8 m interlocking water-filled barrier (red or white)."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["crash_barrier"]
outputs = ["assets/props/src/crash_barrier.glb", "assets/props/src/crash_barrier.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["crash_barrier", "--no-run"]
outputs = ["scenes/props/scripts/crash_barrier.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/crash_barrier.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["white", "orange"]
decals = ["assets/decals/props/stencil_civil.png"]
outputs = [
  "scenes/props/projects/crash_barrier.pigment",
  "scenes/props/textures/crash_barrier",
  "scenes/props/textures/crash_barrier__orange",
  "scenes/props/textures/crash_barrier__white",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["crash_barrier", "--no-index"]
outputs = ["assets/props/crash_barrier.glb", "assets/props/src/crash_barrier_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
category = "traffic"
lod = { lod0_tris = 344, visible_to_m = 82.8 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = {}

[placement.scatter]
slots = ["roadside"]
offset = 0.6
spacing = 8.0
clearance = 0.2
facing = "along"
yaw_jitter = 3
cluster = [2, 6]
cluster_radius = 0.0
cluster_line = true
run = true
density = { default = 1.5, industrial = 4.0, slum = 3.0, luxury = 0.0 }
