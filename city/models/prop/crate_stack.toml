# Smart model (prop/crate_stack). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "crate_stack"
kind = "prop"
title = "Crate stack (Noctis Biologics)"
family = "street props kit"
category = "clutter"
description = "Two wooden shipping crates with stencils and a plastic crate on top."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["crate_stack"]
outputs = ["assets/props/src/crate_stack.glb", "assets/props/src/crate_stack.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["crate_stack", "--no-run"]
outputs = ["scenes/props/scripts/crate_stack.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/crate_stack.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["red", "yellow"]
decals = ["assets/decals/props/stencil_noctis_bio.png", "assets/decals/story/stencil_eye_crossed.png"]
outputs = [
  "scenes/props/projects/crate_stack.pigment",
  "scenes/props/textures/crate_stack",
  "scenes/props/textures/crate_stack__red",
  "scenes/props/textures/crate_stack__yellow",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["crate_stack", "--no-index"]
outputs = ["assets/props/crate_stack.glb", "assets/props/src/crate_stack_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1100
policy = "cell"
proxy = false
world_keys = ["PROP_crate_stack"]
visible_to_m = 150.0
collider = "compound"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 1100, visible_to_m = 62.1 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 120
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { downtown = 19, hillside = 12, midtown = 24, old_town = 31, port = 34 }

[placement.scatter]
slots = ["alley", "frontage"]
offset = 0.6
spacing = 6.0
clearance = 0.9
facing = "random"
yaw_jitter = 20
density = { default = 0.5, industrial = 3.0, market = 2.0, slum = 1.5, luxury = 0.0 }
