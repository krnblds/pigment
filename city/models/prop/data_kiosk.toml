# Smart model (prop/data_kiosk). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "data_kiosk"
kind = "prop"
title = "MERIDIAN data kiosk"
family = "street props kit"
category = "street_furniture"
description = "2.3 m monolith: citizen-score touch screen, eye camera ring, palm scanner, halo LED; ad on the back. Variants change the screen."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["data_kiosk"]
outputs = ["assets/props/src/data_kiosk.glb", "assets/props/src/data_kiosk.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["data_kiosk", "--no-run"]
outputs = ["scenes/props/scripts/data_kiosk.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/data_kiosk.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = ["flagged", "dreamlink", "hacked", "platinum", "loan", "match", "attention"]
decals = [
  "assets/decals/ads/kiosk_attention_unlock.png",
  "assets/decals/ads/kiosk_loan_approved.png",
  "assets/decals/ads/kiosk_match_found.png",
  "assets/decals/ads/kiosk_platinum_offer.png",
  "assets/decals/ads/lightbox_hayate.png",
  "assets/decals/ads/lightbox_matcha.png",
  "assets/decals/ads/lightbox_platinum.png",
  "assets/decals/ads/lightbox_volt_rush.png",
  "assets/decals/props/ad_dreamlink.png",
  "assets/decals/props/ad_meridian.png",
  "assets/decals/props/kiosk_dreamlink.png",
  "assets/decals/props/kiosk_flagged.png",
  "assets/decals/props/kiosk_hacked.png",
  "assets/decals/props/kiosk_score.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/poster_missing_mika.png",
]
outputs = [
  "scenes/props/projects/data_kiosk.pigment",
  "scenes/props/textures/data_kiosk",
  "scenes/props/textures/data_kiosk__attention",
  "scenes/props/textures/data_kiosk__dreamlink",
  "scenes/props/textures/data_kiosk__flagged",
  "scenes/props/textures/data_kiosk__hacked",
  "scenes/props/textures/data_kiosk__loan",
  "scenes/props/textures/data_kiosk__match",
  "scenes/props/textures/data_kiosk__platinum",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["data_kiosk", "--no-index"]
outputs = [
  "assets/props/data_kiosk.glb",
  "assets/props/src/data_kiosk_export.json",
  "assets/props/data_kiosk_lod1.glb",
]
embed = 1024
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 680
policy = "cell"
proxy = false
world_keys = ["PROP_data_kiosk"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = [
  { name = "Light_Screen", type = "omni", color = [0.3, 0.75, 1.0], energy = 30, range = 4.0 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 680, lod1_tris = 340, lod1_from_m = 21.3, visible_to_m = 106.7 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 263
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 10
downtown = 81
hillside = 35
midtown = 87
old_town = 26
port = 17
yoimachi = 7

[placement.scatter]
slots = ["walk", "frontage", "plaza", "corner"]
offset = 0.5
along = [3.5, 5.0]
spacing = 45.0
clearance = 1.2
facing = "road"
yaw_jitter = 0
density = { default = 0.4, downtown = 1.0, commercial = 0.6, luxury = 0.4, slum = 0.1 }
