# Smart model (prop/drone_mast). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "drone_mast"
kind = "prop"
title = "Hoshikawa Aerial drone charging mast"
family = "street props kit"
category = "utility"
description = "7.5 m mast with a hexagonal charging pad (LED rings, red beacon) and a parked courier drone; base cabinet with hazard stripes."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["drone_mast"]
outputs = ["assets/props/src/drone_mast.glb", "assets/props/src/drone_mast.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["drone_mast", "--no-run"]
outputs = ["scenes/props/scripts/drone_mast.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/drone_mast.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = ["clean"]
decals = [
  "assets/decals/props/drone_pad.png",
  "assets/decals/props/drone_plate.png",
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/story/graffiti_who_owns.png",
]
outputs = [
  "scenes/props/projects/drone_mast.pigment",
  "scenes/props/textures/drone_mast",
  "scenes/props/textures/drone_mast__clean",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["drone_mast", "--no-index"]
outputs = [
  "assets/props/drone_mast.glb",
  "assets/props/src/drone_mast_export.json",
  "assets/props/drone_mast_lod1.glb",
]
embed = 1024
lod1_ratio = 0.45

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 2292
policy = "cell"
proxy = false
world_keys = ["PROP_drone_mast", "PROP_drone_mast__clean"]
visible_to_m = 150.0
collider = "compound"
mount = "ground"
lights = [
  { name = "Light_Beacon", type = "omni", color = [1.0, 0.05, 0.05], energy = 4, range = 6.0 },
  { name = "Light_Pad", type = "omni", color = [0.2, 0.8, 1.0], energy = 20, range = 4.0 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 2292, lod1_tris = 1031, lod1_from_m = 72.0, visible_to_m = 360.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 69
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { corporate = 4, downtown = 33, hillside = 1, midtown = 26, port = 4, yoimachi = 1 }

[placement.scatter]
slots = ["plaza", "rooftop", "curb"]
offset = -0.8
spacing = 80.0
clearance = 1.5
facing = "random"
yaw_jitter = 180
density = { default = 0.05, downtown = 0.15, industrial = 0.15, commercial = 0.08 }
