# Smart model (prop/fire_hydrant). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "fire_hydrant"
kind = "prop"
title = "Fire hydrant"
family = "street props kit"
category = "utility"
description = "Cast-iron pillar hydrant with two hose outlets and a pumper nozzle (red, yellow, Hoshikawa teal)."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["fire_hydrant"]
outputs = ["assets/props/src/fire_hydrant.glb", "assets/props/src/fire_hydrant.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["fire_hydrant", "--no-run"]
outputs = ["scenes/props/scripts/fire_hydrant.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/fire_hydrant.jsonl"]
textures = "scenes/props/textures"
resolution = 512
variants = ["yellow", "teal"]
decals = []
outputs = [
  "scenes/props/projects/fire_hydrant.pigment",
  "scenes/props/textures/fire_hydrant",
  "scenes/props/textures/fire_hydrant__teal",
  "scenes/props/textures/fire_hydrant__yellow",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["fire_hydrant", "--no-index"]
outputs = ["assets/props/fire_hydrant.glb", "assets/props/src/fire_hydrant_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1632
policy = "cell"
proxy = false
world_keys = ["PROP_fire_hydrant"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 1632, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 183
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { corporate = 9, downtown = 38, hillside = 27, midtown = 73, old_town = 22, port = 14 }

[placement.scatter]
slots = ["curb"]
offset = -0.45
spacing = 60.0
clearance = 0.5
facing = "road"
yaw_jitter = 10
density = { default = 0.8 }
