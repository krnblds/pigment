# Smart model (prop/guard_rail). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "guard_rail"
kind = "prop"
title = "W-beam guard rail (4 m, tileable)"
family = "street props kit"
category = "traffic"
description = "Galvanised W-beam on two posts at 2 m, 4 m long: chain them end to end along +X."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["guard_rail"]
outputs = ["assets/props/src/guard_rail.glb", "assets/props/src/guard_rail.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["guard_rail", "--no-run"]
outputs = ["scenes/props/scripts/guard_rail.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/guard_rail.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["clean"]
decals = ["assets/decals/story/graffiti_who_owns.png"]
outputs = [
  "scenes/props/projects/guard_rail.pigment",
  "scenes/props/textures/guard_rail",
  "scenes/props/textures/guard_rail__clean",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["guard_rail", "--no-index"]
outputs = ["assets/props/guard_rail.glb", "assets/props/src/guard_rail_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
category = "traffic"
lod = { lod0_tris = 508, visible_to_m = 180.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = {}

[placement.scatter]
slots = ["roadside", "median"]
offset = -0.3
spacing = 0.0
clearance = 0.0
facing = "along"
yaw_jitter = 0
run = true
density = { default = 2.0, industrial = 8.0, residential = 3.0, luxury = 0.0, market = 0.0 }
