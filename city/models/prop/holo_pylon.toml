# Smart model (prop/holo_pylon). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "holo_pylon"
kind = "prop"
title = "Holographic ad pylon"
family = "street props kit"
category = "signage"
description = "4 m triangular pylon of see-through emissive holo panels on an LED plinth; each face shows an ad (variants swap them)."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["holo_pylon"]
outputs = ["assets/props/src/holo_pylon.glb", "assets/props/src/holo_pylon.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["holo_pylon", "--no-run"]
outputs = ["scenes/props/scripts/holo_pylon.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/holo_pylon.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = ["meridian", "hacked", "hotel", "dolls", "sale", "volt"]
decals = [
  "assets/decals/ads/holo_dolls_1.png",
  "assets/decals/ads/holo_dolls_2.png",
  "assets/decals/ads/holo_dolls_3.png",
  "assets/decals/ads/holo_gacha.png",
  "assets/decals/ads/holo_hotel_1.png",
  "assets/decals/ads/holo_hotel_2.png",
  "assets/decals/ads/holo_hotel_3.png",
  "assets/decals/ads/holo_sale_1.png",
  "assets/decals/ads/holo_sale_2.png",
  "assets/decals/ads/holo_sale_3.png",
  "assets/decals/ads/holo_volt.png",
  "assets/decals/props/holo_dreamlink.png",
  "assets/decals/props/holo_hacked.png",
  "assets/decals/props/holo_meridian.png",
  "assets/decals/props/holo_noctis.png",
]
outputs = [
  "scenes/props/projects/holo_pylon.pigment",
  "scenes/props/textures/holo_pylon",
  "scenes/props/textures/holo_pylon__dolls",
  "scenes/props/textures/holo_pylon__hacked",
  "scenes/props/textures/holo_pylon__hotel",
  "scenes/props/textures/holo_pylon__meridian",
  "scenes/props/textures/holo_pylon__sale",
  "scenes/props/textures/holo_pylon__volt",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["holo_pylon", "--no-index"]
outputs = [
  "assets/props/holo_pylon.glb",
  "assets/props/src/holo_pylon_export.json",
  "assets/props/holo_pylon_lod1.glb",
]
embed = 1024
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 304
policy = "cell"
proxy = false
world_keys = [
  "PROP_holo_pylon",
  "PROP_holo_pylon__dolls",
  "PROP_holo_pylon__hacked",
  "PROP_holo_pylon__hotel",
  "PROP_holo_pylon__meridian",
  "PROP_holo_pylon__sale",
  "PROP_holo_pylon__volt",
]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = [
  { name = "Light_Holo", type = "omni", color = [0.6, 0.4, 1.0], energy = 60, range = 7.0 },
]
alpha = ["BLEND"]
lod = { lod0_tris = 304, lod1_tris = 152, lod1_from_m = 32.5, visible_to_m = 162.4 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 166
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 5
downtown = 38
hillside = 17
midtown = 80
old_town = 17
port = 6
yoimachi = 3

[placement.scatter]
slots = ["plaza", "walk", "corner"]
offset = 0.2
along = [4.0, 6.0]
spacing = 40.0
clearance = 1.3
facing = "random"
yaw_jitter = 180

[placement.scatter.density]
default = 0.2
downtown = 0.6
commercial = 0.8
luxury = 0.5
market = 0.4
slum = 0.0
