# Smart model (prop/jersey_barrier). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "jersey_barrier"
kind = "prop"
title = "Concrete jersey barrier (checkpoint)"
family = "street props kit"
category = "traffic"
description = "3 m precast concrete barrier with lifting loops, reflectors, a MERIDIAN checkpoint stencil and resistance tags."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["jersey_barrier"]
outputs = ["assets/props/src/jersey_barrier.glb", "assets/props/src/jersey_barrier.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["jersey_barrier", "--no-run"]
outputs = ["scenes/props/scripts/jersey_barrier.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/jersey_barrier.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["clean"]
decals = [
  "assets/decals/props/stencil_checkpoint.png",
  "assets/decals/story/graffiti_not_data.png",
  "assets/decals/story/graffiti_unplug.png",
]
outputs = [
  "scenes/props/projects/jersey_barrier.pigment",
  "scenes/props/textures/jersey_barrier",
  "scenes/props/textures/jersey_barrier__clean",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["jersey_barrier", "--no-index"]
outputs = ["assets/props/jersey_barrier.glb", "assets/props/src/jersey_barrier_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
category = "traffic"
lod = { lod0_tris = 408, visible_to_m = 135.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = {}

[placement.scatter]
slots = ["roadside", "median"]
offset = 0.4
spacing = 10.0
clearance = 0.3
facing = "along"
yaw_jitter = 2
cluster = [1, 4]
cluster_line = true
run = true
density = { default = 1.0, industrial = 4.0, slum = 3.0, downtown = 2.0, luxury = 0.0 }
