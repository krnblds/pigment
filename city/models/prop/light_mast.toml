# Smart model (prop/light_mast). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "light_mast"
kind = "prop"
title = "Yard high-mast light (30 m)"
family = "street props kit"
category = "port"
description = "Three-section galvanised high mast on a concrete plinth: base plate, anchor bolts, gussets, hazard sleeve, access door, mast plate, cabinet and conduit; lowering ring with eight floods, cap, lightning rod and aviation light."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["light_mast"]
outputs = ["assets/props/src/light_mast.glb", "assets/props/src/light_mast.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["light_mast", "--no-run"]
outputs = ["scenes/props/scripts/light_mast.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/light_mast.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = []
decals = [
  "assets/decals/props/mast_cabinet.png",
  "assets/decals/props/mast_plate.png",
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/story/plate_observed.png",
  "assets/decals/story/poster_unplug.png",
]
outputs = ["scenes/props/projects/light_mast.pigment", "scenes/props/textures/light_mast"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["light_mast", "--no-index"]
outputs = [
  "assets/props/light_mast.glb",
  "assets/props/src/light_mast_export.json",
  "assets/props/light_mast_lod1.glb",
]
embed = 1024
lod1_ratio = 0.35

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "pole"
collision = "cyl"
tris = 2968
policy = "cell"
proxy = false
world_keys = ["PROP_light_mast"]
visible_to_m = 260.0
collider = "compound"
mount = "ground"
lights = [
  { name = "Light_Flood", type = "spot", color = [1.0, 0.8, 0.55], energy = 2600, range = 60 },
  { name = "Light_Beacon", type = "omni", color = [1.0, 0.05, 0.02], energy = 6, range = 12 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 2968, lod1_tris = 1038, lod1_from_m = 285.3, visible_to_m = 1426.5 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 97
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { port = 97 }

[placement.scatter]
slots = []
spacing = 40.0
clearance = 0.0
facing = "random"
yaw_jitter = 0
density = { default = 0.0 }
