# Smart model (prop/neon_arrow_sign). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "neon_arrow_sign"
kind = "prop"
title = "Marquee arrow sign (wall-mounted)"
family = "street props kit"
category = "signage"
description = "Arrow-shaped sign on a wall bracket: neon border, chase bulbs and a lit text panel (HOTEL / BAR / PACHINKO / CAPSULES variants). Origin on the wall at the bracket's bottom; the sign sticks out along +Z."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["neon_arrow_sign"]
outputs = ["assets/props/src/neon_arrow_sign.glb", "assets/props/src/neon_arrow_sign.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["neon_arrow_sign", "--no-run"]
outputs = ["scenes/props/scripts/neon_arrow_sign.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/neon_arrow_sign.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["bar", "pachinko", "capsules"]
decals = [
  "assets/decals/props/arrow_bar.png",
  "assets/decals/props/arrow_capsules.png",
  "assets/decals/props/arrow_hotel.png",
  "assets/decals/props/arrow_pachinko.png",
]
outputs = [
  "scenes/props/projects/neon_arrow_sign.pigment",
  "scenes/props/textures/neon_arrow_sign",
  "scenes/props/textures/neon_arrow_sign__bar",
  "scenes/props/textures/neon_arrow_sign__capsules",
  "scenes/props/textures/neon_arrow_sign__pachinko",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["neon_arrow_sign", "--no-index"]
outputs = ["assets/props/neon_arrow_sign.glb", "assets/props/src/neon_arrow_sign_export.json"]
embed = 1024
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
collider = "none"
mount = "wall"
lights = [
  { name = "Light_Sign", type = "omni", color = [1.0, 0.3, 0.6], energy = 25, range = 5.0 },
]
alpha = ["OPAQUE"]
category = "signage"
lod = { lod0_tris = 784, visible_to_m = 118.9 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = {}

[placement.scatter]
slots = ["facade"]
mount_height = [3.2, 5.5]
offset = 0.0
spacing = 12.0
clearance = 1.0
facing = "road"
yaw_jitter = 0

[placement.scatter.density]
default = 0.8
commercial = 2.0
market = 2.0
slum = 1.0
downtown = 0.3
luxury = 0.2
industrial = 0.2
