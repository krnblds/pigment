# Smart model (prop/overhead_sign). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "overhead_sign"
kind = "prop"
title = "Overhead shop sign (ten shops)"
family = "town kit"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "assets/blender/town/overhead_sign.py"
args = ["assets/town/overhead_sign.glb"]
outputs = ["assets/town/overhead_sign.glb"]
deps = ["assets/blender/town/_kit.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "town_textures"
tool = "tools/town_textures.py"
job = "overhead_sign"
outputs = ["scenes/town/scripts/overhead_sign.jsonl"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/town/scripts/overhead_sign.jsonl"]
textures = "scenes/town/textures"
resolution = 1024
variants = [
  "memory_pawn",
  "implant_repair",
  "score_reset",
  "capsule",
  "noodles",
  "clinic",
  "jailbreak",
  "organ_credit",
  "karaoke",
  "charging",
  "welcome",
  "velvet_moon",
  "peep_show",
  "snack",
]
decals = [
  "assets/decals/ads/sign_dolls_kisaragi.png",
  "assets/decals/ads/sign_host_zero.png",
  "assets/decals/ads/sign_peep_show.png",
  "assets/decals/ads/sign_snack_yocho.png",
  "assets/decals/ads/sign_velvet_moon.png",
  "assets/decals/ads/sign_welcome_yoimachi.png",
  "assets/decals/story/sign_capsule_2h.png",
  "assets/decals/story/sign_charge.png",
  "assets/decals/story/sign_clinic.png",
  "assets/decals/story/sign_dreams.png",
  "assets/decals/story/sign_dumplings.png",
  "assets/decals/story/sign_implant_repair.png",
  "assets/decals/story/sign_jailbreak.png",
  "assets/decals/story/sign_karaoke.png",
  "assets/decals/story/sign_memory_pawn.png",
  "assets/decals/story/sign_offgrid.png",
  "assets/decals/story/sign_organ_credit.png",
  "assets/decals/story/sign_score_reset.png",
]
outputs = [
  "scenes/town/projects/overhead_sign.pigment",
  "scenes/town/textures/overhead_sign",
  "scenes/town/textures/overhead_sign__capsule",
  "scenes/town/textures/overhead_sign__charging",
  "scenes/town/textures/overhead_sign__clinic",
  "scenes/town/textures/overhead_sign__implant_repair",
  "scenes/town/textures/overhead_sign__jailbreak",
  "scenes/town/textures/overhead_sign__karaoke",
  "scenes/town/textures/overhead_sign__memory_pawn",
  "scenes/town/textures/overhead_sign__noodles",
  "scenes/town/textures/overhead_sign__organ_credit",
  "scenes/town/textures/overhead_sign__peep_show",
  "scenes/town/textures/overhead_sign__score_reset",
  "scenes/town/textures/overhead_sign__snack",
  "scenes/town/textures/overhead_sign__velvet_moon",
  "scenes/town/textures/overhead_sign__welcome",
]
patch = []

[pigment.decal_slots]
face_e = [
  "sign_capsule_2h",
  "sign_clinic",
  "sign_dolls_kisaragi",
  "sign_dreams",
  "sign_dumplings",
  "sign_host_zero",
  "sign_implant_repair",
  "sign_memory_pawn",
  "sign_offgrid",
  "sign_organ_credit",
  "sign_score_reset",
  "sign_velvet_moon",
  "sign_welcome_yoimachi",
]
face_w = [
  "sign_capsule_2h",
  "sign_charge",
  "sign_clinic",
  "sign_dumplings",
  "sign_implant_repair",
  "sign_jailbreak",
  "sign_karaoke",
  "sign_memory_pawn",
  "sign_organ_credit",
  "sign_peep_show",
  "sign_score_reset",
  "sign_snack_yocho",
  "sign_velvet_moon",
  "sign_welcome_yoimachi",
]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "sign"
collision = "none"
tris = 1364
policy = "cell"
proxy = false
world_keys = [
  "overhead_sign__capsule",
  "overhead_sign__charging",
  "overhead_sign__clinic",
  "overhead_sign__implant_repair",
  "overhead_sign__jailbreak",
  "overhead_sign__karaoke",
  "overhead_sign__memory_pawn",
  "overhead_sign__noodles",
  "overhead_sign__organ_credit",
  "overhead_sign__peep_show",
  "overhead_sign__score_reset",
  "overhead_sign__snack",
  "overhead_sign__velvet_moon",
  "overhead_sign__welcome",
]
visible_to_m = 220.0

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
