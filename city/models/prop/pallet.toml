# Smart model (prop/pallet). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "pallet"
kind = "prop"
title = "Wooden pallet"
family = "street props kit"
category = "clutter"
description = "1.2 x 0.8 m pallet; stack them or lean them on walls."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["pallet"]
outputs = ["assets/props/src/pallet.glb", "assets/props/src/pallet.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["pallet", "--no-run"]
outputs = ["scenes/props/scripts/pallet.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/pallet.jsonl"]
textures = "scenes/props/textures"
resolution = 512
variants = []
decals = ["assets/decals/props/box_logistics.png"]
outputs = ["scenes/props/projects/pallet.pigment", "scenes/props/textures/pallet"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["pallet", "--no-index"]
outputs = ["assets/props/pallet.glb", "assets/props/src/pallet_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 880
policy = "cell"
proxy = false
world_keys = ["PROP_pallet"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 880, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 314
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { hillside = 20, midtown = 74, old_town = 70, port = 128, yoimachi = 22 }

[placement.scatter]
slots = ["alley", "frontage"]
offset = 0.6
spacing = 4.0
clearance = 0.8
facing = "random"
yaw_jitter = 20
cluster = [1, 3]
cluster_radius = 0.0
stack = true

[placement.scatter.density]
default = 0.5
industrial = 4.0
market = 2.0
slum = 2.0
luxury = 0.0
downtown = 0.0
