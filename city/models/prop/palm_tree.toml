# Smart model (prop/palm_tree). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "palm_tree"
kind = "prop"
title = "Palm (luxury island)"
family = "street props kit"
category = "nature"
description = "7 m curved palm with ringed trunk, 11 fronds, coconuts and a ground uplighter (Light_Uplight)."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["palm_tree"]
outputs = ["assets/props/src/palm_tree.glb", "assets/props/src/palm_tree.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["palm_tree", "--no-run"]
outputs = ["scenes/props/scripts/palm_tree.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/palm_tree.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = []
decals = []
outputs = ["scenes/props/projects/palm_tree.pigment", "scenes/props/textures/palm_tree"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["palm_tree", "--no-index"]
outputs = [
  "assets/props/palm_tree.glb",
  "assets/props/src/palm_tree_export.json",
  "assets/props/palm_tree_lod1.glb",
]
embed = 512
lod1_ratio = 0.35

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 2680
policy = "cell"
proxy = false
world_keys = ["PROP_palm_tree"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = [
  { name = "Light_Uplight", type = "spot", color = [1.0, 0.85, 0.6], energy = 80, range = 9.0 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 2680, lod1_tris = 937, lod1_from_m = 69.1, visible_to_m = 345.7 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 40
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { corporate = 40 }

[placement.scatter]
slots = ["curb", "plaza", "frontage"]
offset = -1.0
spacing = 7.0
clearance = 1.5
facing = "random"
yaw_jitter = 180
density = { default = 0.0, luxury = 3.0 }
