# Smart model (prop/parking_meter). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "parking_meter"
kind = "prop"
title = "Pay-by-score parking meter"
family = "street props kit"
category = "street_furniture"
description = "Post-mounted meter with a screen (PAY BY SCORE), card reader and solar cap."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["parking_meter"]
outputs = ["assets/props/src/parking_meter.glb", "assets/props/src/parking_meter.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["parking_meter", "--no-run"]
outputs = ["scenes/props/scripts/parking_meter.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/parking_meter.jsonl"]
textures = "scenes/props/textures"
resolution = 512
variants = ["graphite"]
decals = [
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/props/parking_screen.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/props/projects/parking_meter.pigment",
  "scenes/props/textures/parking_meter",
  "scenes/props/textures/parking_meter__graphite",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["parking_meter", "--no-index"]
outputs = ["assets/props/parking_meter.glb", "assets/props/src/parking_meter_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 408
policy = "cell"
proxy = false
world_keys = ["PROP_parking_meter"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 408, visible_to_m = 68.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 1356
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 43
downtown = 429
hillside = 137
midtown = 648
old_town = 26
port = 73

[placement.scatter]
slots = ["curb"]
offset = -0.45
spacing = 7.0
clearance = 0.35
facing = "road"
yaw_jitter = 0
cluster = [1, 3]
cluster_radius = 0.0
cluster_line = true
density = { default = 1.5, downtown = 3.0, commercial = 2.5, slum = 0.0, market = 0.5 }
