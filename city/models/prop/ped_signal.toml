# Smart model (prop/ped_signal). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "ped_signal"
kind = "prop"
title = "Pedestrian signal post"
family = "street props kit"
category = "traffic"
description = "2.9 m post with a walk / stop head, countdown screen and push button."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["ped_signal"]
outputs = ["assets/props/src/ped_signal.glb", "assets/props/src/ped_signal.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["ped_signal", "--no-run"]
outputs = ["scenes/props/scripts/ped_signal.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/ped_signal.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = []
decals = [
  "assets/decals/props/ped_count.png",
  "assets/decals/props/ped_stop.png",
  "assets/decals/props/ped_walk.png",
  "assets/decals/props/push_button.png",
  "assets/decals/story/graffiti_unplug.png",
]
outputs = ["scenes/props/projects/ped_signal.pigment", "scenes/props/textures/ped_signal"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["ped_signal", "--no-index"]
outputs = ["assets/props/ped_signal.glb", "assets/props/src/ped_signal_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 948
policy = "cell"
proxy = false
world_keys = ["PROP_ped_signal"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 948, visible_to_m = 134.6 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 530
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { roads = 530 }

[placement.scatter]
slots = ["crossing"]
along = [0.9, 1.6]
offset = -0.5
spacing = 4.0
clearance = 0.4
facing = "road"
yaw_jitter = 0
density = { default = 0.8, slum = 0.3 }
