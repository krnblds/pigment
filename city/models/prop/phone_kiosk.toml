# Smart model (prop/phone_kiosk). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "phone_kiosk"
kind = "prop"
title = "Public line booth"
family = "street props kit"
category = "street_furniture"
description = "Hooded wall-less payphone on two legs (PUBLIC LINE - MONITORED), handset, keypad, small screen, light under the hood."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["phone_kiosk"]
outputs = ["assets/props/src/phone_kiosk.glb", "assets/props/src/phone_kiosk.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["phone_kiosk", "--no-run"]
outputs = ["scenes/props/scripts/phone_kiosk.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/phone_kiosk.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["red", "cream"]
decals = [
  "assets/decals/props/ad_dreamlink.png",
  "assets/decals/props/ad_security.png",
  "assets/decals/props/phone_header.png",
  "assets/decals/props/phone_screen.png",
  "assets/decals/story/graffiti_lying.png",
  "assets/decals/story/poster_missing_aiko.png",
]
outputs = [
  "scenes/props/projects/phone_kiosk.pigment",
  "scenes/props/textures/phone_kiosk",
  "scenes/props/textures/phone_kiosk__cream",
  "scenes/props/textures/phone_kiosk__red",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["phone_kiosk", "--no-index"]
outputs = [
  "assets/props/phone_kiosk.glb",
  "assets/props/src/phone_kiosk_export.json",
  "assets/props/phone_kiosk_lod1.glb",
]
embed = 512
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 704
policy = "cell"
proxy = false
world_keys = ["PROP_phone_kiosk"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = [
  { name = "Light_Hood", type = "omni", color = [0.9, 0.95, 1.0], energy = 15, range = 3.0 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 704, lod1_tris = 352, lod1_from_m = 20.7, visible_to_m = 103.5 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 144
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { downtown = 37, hillside = 27, midtown = 57, old_town = 12, port = 11 }

[placement.scatter]
slots = ["frontage", "walk"]
offset = 0.35
spacing = 40.0
clearance = 0.9
facing = "road"
yaw_jitter = 0
density = { default = 0.4, slum = 0.8, residential = 0.6, luxury = 0.0 }
