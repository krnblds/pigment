# Smart model (prop/planter). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "planter"
kind = "prop"
title = "Concrete planter with shrubs"
family = "street props kit"
category = "nature"
description = "1.6 m concrete planter, soil, clipped shrubs and a Hoshikawa Parks plate."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["planter"]
outputs = ["assets/props/src/planter.glb", "assets/props/src/planter.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["planter", "--no-run"]
outputs = ["scenes/props/scripts/planter.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/planter.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["tagged"]
decals = ["assets/decals/props/planter_plate.png", "assets/decals/story/graffiti_who_owns.png"]
outputs = [
  "scenes/props/projects/planter.pigment",
  "scenes/props/textures/planter",
  "scenes/props/textures/planter__tagged",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["planter", "--no-index"]
outputs = [
  "assets/props/planter.glb",
  "assets/props/src/planter_export.json",
  "assets/props/planter_lod1.glb",
]
embed = 512
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 520
policy = "cell"
proxy = false
world_keys = ["PROP_planter"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 520, lod1_tris = 260, lod1_from_m = 20.0, visible_to_m = 74.4 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 328
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { corporate = 53, downtown = 116, hillside = 49, midtown = 88, old_town = 22 }

[placement.scatter]
slots = ["walk", "frontage", "plaza"]
offset = 0.6
spacing = 8.0
clearance = 1.0
facing = "road"
yaw_jitter = 0

[placement.scatter.density]
default = 0.6
luxury = 3.0
downtown = 1.5
residential = 1.0
slum = 0.0
industrial = 0.0
