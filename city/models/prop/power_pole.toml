# Smart model (prop/power_pole). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "power_pole"
kind = "prop"
title = "Power pole with five wires"
family = "town kit"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "assets/blender/town/power_pole.py"
args = ["assets/town/power_pole.glb"]
outputs = ["assets/town/power_pole.glb"]
deps = ["assets/blender/town/_kit.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "town_textures"
tool = "tools/town_textures.py"
job = "power_pole"
outputs = ["scenes/town/scripts/power_pole.jsonl"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/town/scripts/power_pole.jsonl"]
textures = "scenes/town/textures"
resolution = 1024
variants = []
decals = []
outputs = ["scenes/town/projects/power_pole.pigment", "scenes/town/textures/power_pole"]
patch = []
decal_slots = {}

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "pole"
collision = "cyl"
tris = 3746
policy = "cell"
proxy = false
world_keys = ["power_pole"]
visible_to_m = 260.0

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 590
source = "tools/world/placement.py"
rules = "street furniture along roads (world_config.json props)"
districts = { roads = 590 }
