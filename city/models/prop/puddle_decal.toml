# Smart model (prop/puddle_decal). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "puddle_decal"
kind = "prop"
title = "Puddle decals (3 shapes)"
family = "street props kit"
category = "decal"
description = "Flat alpha-blended puddles: nodes Puddle_S (1.2 m), Puddle_M (2.2 m), Puddle_L (3.2 m). Lay 1-2 cm above the ground, no shadows."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["puddle_decal"]
outputs = ["assets/props/src/puddle_decal.glb", "assets/props/src/puddle_decal.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["puddle_decal", "--no-run"]
outputs = ["scenes/props/scripts/puddle_decal.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/puddle_decal.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = []
decals = [
  "assets/decals/props/puddle_a.png",
  "assets/decals/props/puddle_b.png",
  "assets/decals/props/puddle_c.png",
]
outputs = ["scenes/props/projects/puddle_decal.pigment", "scenes/props/textures/puddle_decal"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["puddle_decal", "--no-index"]
outputs = ["assets/props/puddle_decal.glb", "assets/props/src/puddle_decal_export.json"]
embed = 1024
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
collider = "none"
mount = "ground"
lights = []
alpha = ["BLEND"]
category = "decal"
lod = { lod0_tris = 72, visible_to_m = 351.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = {}

[placement.scatter]
slots = ["road", "plaza"]
spacing = 6.0
clearance = 0.0
facing = "random"
yaw_jitter = 180
decal = true
density = { default = 0.25, slum = 0.6, industrial = 0.5, market = 0.4, luxury = 0.1 }
