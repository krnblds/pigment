# Smart model (prop/ramen_cart). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "ramen_cart"
kind = "prop"
title = "Ramen yatai cart"
family = "street props kit"
category = "food"
description = "Wooden two-wheel cart: counter, roof on posts, noren curtains, red paper lanterns (lit), stools and a steaming pot."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["ramen_cart"]
outputs = ["assets/props/src/ramen_cart.glb", "assets/props/src/ramen_cart.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["ramen_cart", "--no-run"]
outputs = ["scenes/props/scripts/ramen_cart.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/ramen_cart.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = []
decals = [
  "assets/decals/props/lantern_ramen.png",
  "assets/decals/props/noren_ramen.png",
  "assets/decals/props/ramen_menu.png",
  "assets/decals/props/ramen_roof_sign.png",
  "assets/decals/story/poster_missing_mika.png",
]
outputs = ["scenes/props/projects/ramen_cart.pigment", "scenes/props/textures/ramen_cart"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["ramen_cart", "--no-index"]
outputs = [
  "assets/props/ramen_cart.glb",
  "assets/props/src/ramen_cart_export.json",
  "assets/props/ramen_cart_lod1.glb",
]
embed = 1024
lod1_ratio = 0.45

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 3708
policy = "cell"
proxy = false
world_keys = ["PROP_ramen_cart"]
visible_to_m = 150.0
collider = "compound"
mount = "ground"
lights = [
  { name = "Light_Lantern_0", type = "omni", color = [1.0, 0.25, 0.1], energy = 18, range = 4.0 },
  { name = "Light_Lantern_1", type = "omni", color = [1.0, 0.25, 0.1], energy = 18, range = 4.0 },
  { name = "Light_Counter", type = "omni", color = [1.0, 0.75, 0.45], energy = 30, range = 4.5 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 3708, lod1_tris = 1668, lod1_from_m = 24.3, visible_to_m = 121.5 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 28
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { hillside = 1, midtown = 21, old_town = 6 }

[placement.scatter]
slots = ["frontage", "alley", "plaza"]
offset = 1.4
spacing = 25.0
clearance = 1.8
facing = "road"
yaw_jitter = 0

[placement.scatter.density]
default = 0.1
market = 1.2
commercial = 0.4
slum = 0.4
residential = 0.2
downtown = 0.0
luxury = 0.0
