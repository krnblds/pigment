# Smart model (prop/satellite_dish). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "satellite_dish"
kind = "prop"
title = "Satellite dish on a ballast mount"
family = "street props kit"
category = "rooftop"
description = "1.2 m dish (Dreamlink uplink) on a non-penetrating ballast frame."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["satellite_dish"]
outputs = ["assets/props/src/satellite_dish.glb", "assets/props/src/satellite_dish.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["satellite_dish", "--no-run"]
outputs = ["scenes/props/scripts/satellite_dish.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/satellite_dish.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = []
decals = ["assets/decals/props/dish_logo.png"]
outputs = ["scenes/props/projects/satellite_dish.pigment", "scenes/props/textures/satellite_dish"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["satellite_dish", "--no-index"]
outputs = [
  "assets/props/satellite_dish.glb",
  "assets/props/src/satellite_dish_export.json",
  "assets/props/satellite_dish_lod1.glb",
]
embed = 512
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1748
policy = "cell"
proxy = false
world_keys = ["PROP_satellite_dish"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 1748, lod1_tris = 873, lod1_from_m = 20.0, visible_to_m = 78.3 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 690
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { corporate = 70, downtown = 349, midtown = 271 }

[placement.scatter]
slots = ["rooftop"]
spacing = 4.0
clearance = 1.0
facing = "random"
yaw_jitter = 40
density = { default = 1.0, residential = 2.0, slum = 2.5 }
