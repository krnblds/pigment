# Smart model (prop/scooter). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "scooter"
kind = "prop"
title = "Hoshikawa Ride share e-scooter"
family = "street props kit"
category = "clutter"
description = "Rental kick scooter on its stand, with a display and a scan plate."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["scooter"]
outputs = ["assets/props/src/scooter.glb", "assets/props/src/scooter.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["scooter", "--no-run"]
outputs = ["scenes/props/scripts/scooter.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/scooter.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["pink", "violet"]
decals = [
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/props/scooter_display.png",
  "assets/decals/props/scooter_qr.png",
  "assets/decals/props/scooter_stem.png",
]
outputs = [
  "scenes/props/projects/scooter.pigment",
  "scenes/props/textures/scooter",
  "scenes/props/textures/scooter__pink",
  "scenes/props/textures/scooter__violet",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["scooter", "--no-index"]
outputs = [
  "assets/props/scooter.glb",
  "assets/props/src/scooter_export.json",
  "assets/props/scooter_lod1.glb",
]
embed = 512
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1144
policy = "cell"
proxy = false
world_keys = ["PROP_scooter", "PROP_scooter__pink", "PROP_scooter__violet"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 1144, lod1_tris = 572, lod1_from_m = 20.0, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 1203
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 34
downtown = 362
hillside = 97
midtown = 541
old_town = 68
port = 70
yoimachi = 31

[placement.scatter]
slots = ["curb", "frontage", "plaza"]
offset = -0.7
spacing = 1.0
clearance = 0.35
facing = "random"
yaw_jitter = 60
cluster = [1, 3]
cluster_radius = 0.0
cluster_line = true
cluster_gap = 0.55
density = { default = 0.8, downtown = 1.5, commercial = 1.5, slum = 0.3 }
