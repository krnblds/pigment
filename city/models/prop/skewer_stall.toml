# Smart model (prop/skewer_stall). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "skewer_stall"
kind = "prop"
title = "Yakitori skewer stall"
family = "street props kit"
category = "food"
description = "Market stall: canopy on poles, charcoal grill with glowing coals and skewers, string lights, menu board, crates and a gas bottle."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["skewer_stall"]
outputs = ["assets/props/src/skewer_stall.glb", "assets/props/src/skewer_stall.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["skewer_stall", "--no-run"]
outputs = ["scenes/props/scripts/skewer_stall.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/skewer_stall.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = []
decals = [
  "assets/decals/props/yakitori_menu.png",
  "assets/decals/props/yakitori_valance.png",
  "assets/decals/story/poster_unplug.png",
]
outputs = ["scenes/props/projects/skewer_stall.pigment", "scenes/props/textures/skewer_stall"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["skewer_stall", "--no-index"]
outputs = [
  "assets/props/skewer_stall.glb",
  "assets/props/src/skewer_stall_export.json",
  "assets/props/skewer_stall_lod1.glb",
]
embed = 1024
lod1_ratio = 0.45

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1964
policy = "cell"
proxy = false
world_keys = ["PROP_skewer_stall"]
visible_to_m = 150.0
collider = "compound"
mount = "ground"
lights = [
  { name = "Light_Grill", type = "omni", color = [1.0, 0.4, 0.1], energy = 15, range = 3.0 },
  { name = "Light_String", type = "omni", color = [1.0, 0.8, 0.5], energy = 25, range = 5.0 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 1964, lod1_tris = 883, lod1_from_m = 22.0, visible_to_m = 109.8 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 20
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { hillside = 2, midtown = 6, old_town = 8, yoimachi = 4 }

[placement.scatter]
slots = ["frontage", "plaza", "alley"]
offset = 1.4
spacing = 12.0
clearance = 1.8
facing = "road"
yaw_jitter = 0

[placement.scatter.density]
default = 0.1
market = 1.5
commercial = 0.3
slum = 0.4
downtown = 0.0
luxury = 0.0
