# Smart model (prop/steam_vent). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "steam_vent"
kind = "prop"
title = "Manhole steam stack"
family = "street props kit"
category = "utility"
description = "Orange-and-white steam chimney over a manhole: put a steam particle emitter at Socket_Steam."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["steam_vent"]
outputs = ["assets/props/src/steam_vent.glb", "assets/props/src/steam_vent.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["steam_vent", "--no-run"]
outputs = ["scenes/props/scripts/steam_vent.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/steam_vent.jsonl"]
textures = "scenes/props/textures"
resolution = 512
variants = []
decals = ["assets/decals/props/meridian_sticker.png"]
outputs = ["scenes/props/projects/steam_vent.pigment", "scenes/props/textures/steam_vent"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["steam_vent", "--no-index"]
outputs = ["assets/props/steam_vent.glb", "assets/props/src/steam_vent_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
collider = "cylinder"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
category = "utility"
lod = { lod0_tris = 1048, visible_to_m = 63.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = {}

[placement.scatter]
slots = ["road"]
spacing = 30.0
clearance = 1.5
facing = "random"
yaw_jitter = 180
density = { default = 0.02, downtown = 0.04, commercial = 0.04, industrial = 0.06, luxury = 0.0 }
