# Smart model (prop/street_name_sign). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "street_name_sign"
kind = "prop"
title = "Street-name sign (two crossed blades)"
family = "street props kit"
category = "signage"
description = "Pole with two crossed blades (Japanese + English street names) and a finial."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["street_name_sign"]
outputs = ["assets/props/src/street_name_sign.glb", "assets/props/src/street_name_sign.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["street_name_sign", "--no-run"]
outputs = ["scenes/props/scripts/street_name_sign.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/street_name_sign.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["neon_yokocho", "meridian_ave"]
decals = [
  "assets/decals/props/route_plate.png",
  "assets/decals/props/street_hoshikawa_dori.png",
  "assets/decals/props/street_kioku_zaka.png",
  "assets/decals/props/street_meridian_ave.png",
  "assets/decals/props/street_neon_yokocho.png",
  "assets/decals/props/street_shin_yume.png",
  "assets/decals/story/poster_unplug.png",
]
outputs = [
  "scenes/props/projects/street_name_sign.pigment",
  "scenes/props/textures/street_name_sign",
  "scenes/props/textures/street_name_sign__meridian_ave",
  "scenes/props/textures/street_name_sign__neon_yokocho",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["street_name_sign", "--no-index"]
outputs = ["assets/props/street_name_sign.glb", "assets/props/src/street_name_sign_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 422
policy = "cell"
proxy = false
world_keys = ["PROP_street_name_sign"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 422, visible_to_m = 151.7 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 262
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { corporate = 5, downtown = 79, hillside = 49, midtown = 85, old_town = 29, port = 15 }

[placement.scatter]
slots = ["corner"]
along = [2.2, 3.5]
offset = -0.5
spacing = 8.0
clearance = 0.4
facing = "road"
yaw_jitter = 0
density = { default = 0.7, downtown = 0.9, slum = 0.4 }
