# Smart model (prop/street_tree). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "street_tree"
kind = "prop"
title = "Stylised street tree in a grate"
family = "street props kit"
category = "nature"
description = "5 m tree: tapered trunk, three branches, clumped canopy, iron tree guard and grate."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["street_tree"]
outputs = ["assets/props/src/street_tree.glb", "assets/props/src/street_tree.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["street_tree", "--no-run"]
outputs = ["scenes/props/scripts/street_tree.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/street_tree.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["autumn", "violet"]
decals = []
outputs = [
  "scenes/props/projects/street_tree.pigment",
  "scenes/props/textures/street_tree",
  "scenes/props/textures/street_tree__autumn",
  "scenes/props/textures/street_tree__violet",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["street_tree", "--no-index"]
outputs = [
  "assets/props/street_tree.glb",
  "assets/props/src/street_tree_export.json",
  "assets/props/street_tree_lod1.glb",
]
embed = 512
lod1_ratio = 0.35

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1292
policy = "cell"
proxy = false
world_keys = ["PROP_street_tree"]
visible_to_m = 150.0
collider = "compound"
mount = "ground"
lights = []
alpha = ["BLEND"]
lod = { lod0_tris = 1292, lod1_tris = 452, lod1_from_m = 44.5, visible_to_m = 222.3 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 267
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { corporate = 15, downtown = 68, hillside = 79, midtown = 96, old_town = 9 }

[placement.scatter]
slots = ["curb", "plaza"]
offset = -0.9
spacing = 9.0
clearance = 1.2
facing = "random"
yaw_jitter = 180

[placement.scatter.density]
default = 0.8
residential = 2.0
luxury = 1.0
downtown = 1.0
slum = 0.0
industrial = 0.0
market = 0.3
