# Smart model (prop/traffic_cone). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "traffic_cone"
kind = "prop"
title = "Traffic cone"
family = "street props kit"
category = "traffic"
description = "70 cm cone with two reflective collars on a rubber base."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["traffic_cone"]
outputs = ["assets/props/src/traffic_cone.glb", "assets/props/src/traffic_cone.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["traffic_cone", "--no-run"]
outputs = ["scenes/props/scripts/traffic_cone.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/traffic_cone.jsonl"]
textures = "scenes/props/textures"
resolution = 512
variants = []
decals = []
outputs = ["scenes/props/projects/traffic_cone.pigment", "scenes/props/textures/traffic_cone"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["traffic_cone", "--no-index"]
outputs = ["assets/props/traffic_cone.glb", "assets/props/src/traffic_cone_export.json"]
embed = 256
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 434
policy = "cell"
proxy = false
world_keys = ["PROP_traffic_cone"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 434, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 826
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { downtown = 163, hillside = 114, midtown = 273, old_town = 80, port = 196 }

[placement.scatter]
slots = ["roadside", "curb"]
offset = 0.5
spacing = 3.0
clearance = 0.3
facing = "random"
yaw_jitter = 180
cluster = [1, 5]
cluster_radius = 1.5
density = { default = 0.8, industrial = 3.0, slum = 2.0, luxury = 0.0 }
