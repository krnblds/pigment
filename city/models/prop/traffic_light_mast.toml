# Smart model (prop/traffic_light_mast). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "traffic_light_mast"
kind = "prop"
title = "Mast-arm traffic signal (two horizontal heads over the road)"
family = "street props kit"
category = "traffic"
description = "6 m tapered pole, 6.5 m arm reaching out to +X over the lanes, two horizontal 3-light heads, a street-name blade and a MERIDIAN camera at the tip."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["traffic_light_mast"]
outputs = ["assets/props/src/traffic_light_mast.glb", "assets/props/src/traffic_light_mast.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["traffic_light_mast", "--no-run"]
outputs = ["scenes/props/scripts/traffic_light_mast.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/traffic_light_mast.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = ["hoshikawa_dori", "kioku_zaka_grey"]
decals = [
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/props/push_button.png",
  "assets/decals/props/street_hoshikawa_dori.png",
  "assets/decals/props/street_kioku_zaka.png",
  "assets/decals/props/street_meridian_ave.png",
]
outputs = [
  "scenes/props/projects/traffic_light_mast.pigment",
  "scenes/props/textures/traffic_light_mast",
  "scenes/props/textures/traffic_light_mast__hoshikawa_dori",
  "scenes/props/textures/traffic_light_mast__kioku_zaka_grey",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["traffic_light_mast", "--no-index"]
outputs = [
  "assets/props/traffic_light_mast.glb",
  "assets/props/src/traffic_light_mast_export.json",
  "assets/props/traffic_light_mast_lod1.glb",
]
embed = 1024
lod1_ratio = 0.4

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 4032
policy = "cell"
proxy = false
world_keys = ["PROP_traffic_light_mast"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = [
  { name = "Light_Cam", type = "omni", color = [1, 0.1, 0.1], energy = 0.3, range = 1.0 },
]
alpha = ["OPAQUE"]
lod = { lod0_tris = 4032, lod1_tris = 2023, lod1_from_m = 62.6, visible_to_m = 312.8 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 265
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { roads = 265 }

[placement.scatter]
slots = ["corner"]
along = [0.8, 1.5]
offset = -0.6
spacing = 14.0
clearance = 0.6
facing = "road"
yaw_jitter = 0

[placement.scatter.density]
default = 0.5
downtown = 0.9
commercial = 0.7
luxury = 0.7
slum = 0.0
market = 0.1
