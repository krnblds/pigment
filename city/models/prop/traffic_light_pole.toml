# Smart model (prop/traffic_light_pole). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "traffic_light_pole"
kind = "prop"
title = "Traffic signal pole (3-light head + pedestrian head)"
family = "street props kit"
category = "traffic"
description = "Galvanised pole with a vertical 3-light vehicle head facing front and a pedestrian head facing +X, push-button box and a MERIDIAN sensor puck."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["traffic_light_pole"]
outputs = ["assets/props/src/traffic_light_pole.glb", "assets/props/src/traffic_light_pole.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["traffic_light_pole", "--no-run"]
outputs = ["scenes/props/scripts/traffic_light_pole.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/traffic_light_pole.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["grey", "black"]
decals = [
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/props/ped_stop.png",
  "assets/decals/props/ped_walk.png",
  "assets/decals/props/push_button.png",
  "assets/decals/story/poster_missing_ren.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/props/projects/traffic_light_pole.pigment",
  "scenes/props/textures/traffic_light_pole",
  "scenes/props/textures/traffic_light_pole__black",
  "scenes/props/textures/traffic_light_pole__grey",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["traffic_light_pole", "--no-index"]
outputs = [
  "assets/props/traffic_light_pole.glb",
  "assets/props/src/traffic_light_pole_export.json",
  "assets/props/traffic_light_pole_lod1.glb",
]
embed = 1024
lod1_ratio = 0.45

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
collider = "compound"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
category = "traffic"
lod = { lod0_tris = 2324, lod1_tris = 1184, lod1_from_m = 35.3, visible_to_m = 176.4 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = {}

[placement.scatter]
slots = ["corner"]
along = [1.2, 2.0]
offset = -0.55
spacing = 6.0
clearance = 0.5
facing = "road"
yaw_jitter = 0
density = { default = 0.9, residential = 0.6, slum = 0.3, market = 0.4 }
