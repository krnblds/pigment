# Smart model (prop/trash_bag_pile). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "trash_bag_pile"
kind = "prop"
title = "Trash bag pile"
family = "street props kit"
category = "clutter"
description = "Four tied bin bags (black and blue)."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["trash_bag_pile"]
outputs = ["assets/props/src/trash_bag_pile.glb", "assets/props/src/trash_bag_pile.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["trash_bag_pile", "--no-run"]
outputs = ["scenes/props/scripts/trash_bag_pile.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/trash_bag_pile.jsonl"]
textures = "scenes/props/textures"
resolution = 512
variants = []
decals = []
outputs = ["scenes/props/projects/trash_bag_pile.pigment", "scenes/props/textures/trash_bag_pile"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["trash_bag_pile", "--no-index"]
outputs = ["assets/props/trash_bag_pile.glb", "assets/props/src/trash_bag_pile_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 1360
policy = "cell"
proxy = false
world_keys = ["PROP_trash_bag_pile"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 1360, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 953
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { downtown = 46, hillside = 117, midtown = 379, old_town = 296, port = 115 }

[placement.scatter]
slots = ["frontage", "alley", "curb"]
offset = 0.4
spacing = 4.0
clearance = 0.8
facing = "random"
yaw_jitter = 180

[placement.scatter.density]
default = 2.0
slum = 8.0
market = 6.0
industrial = 3.0
luxury = 0.0
downtown = 0.5
