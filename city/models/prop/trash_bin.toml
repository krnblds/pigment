# Smart model (prop/trash_bin). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "trash_bin"
kind = "prop"
title = "Twin-slot street bin (BURNABLE / CANS)"
family = "street props kit"
category = "clutter"
description = "Hoshikawa Sanitation bin with two labelled slots."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["trash_bin"]
outputs = ["assets/props/src/trash_bin.glb", "assets/props/src/trash_bin.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["trash_bin", "--no-run"]
outputs = ["scenes/props/scripts/trash_bin.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/trash_bin.jsonl"]
textures = "scenes/props/textures"
resolution = 1024
variants = ["red", "graphite"]
decals = [
  "assets/decals/props/bin_burnable.png",
  "assets/decals/props/bin_cans.png",
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/story/graffiti_not_data.png",
]
outputs = [
  "scenes/props/projects/trash_bin.pigment",
  "scenes/props/textures/trash_bin",
  "scenes/props/textures/trash_bin__graphite",
  "scenes/props/textures/trash_bin__red",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["trash_bin", "--no-index"]
outputs = ["assets/props/trash_bin.glb", "assets/props/src/trash_bin_export.json"]
embed = 512
lod1_ratio = 0.0

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 444
policy = "cell"
proxy = false
world_keys = ["PROP_trash_bin", "PROP_trash_bin__graphite", "PROP_trash_bin__red"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 444, visible_to_m = 60.0 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 389
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 23
downtown = 99
hillside = 50
midtown = 131
old_town = 42
port = 27
yoimachi = 17

[placement.scatter]
slots = ["walk", "curb", "plaza"]
offset = -0.6
spacing = 30.0
clearance = 0.6
facing = "road"
yaw_jitter = 0
density = { default = 1.0, downtown = 1.5, luxury = 1.5, slum = 0.3 }
