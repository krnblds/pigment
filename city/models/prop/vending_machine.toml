# Smart model (prop/vending_machine). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "vending_machine"
kind = "prop"
title = "Vending machine (drinks / Noctis memory capsules / instant ramen)"
family = "street props kit"
category = "clutter"
description = "1.0 x 0.75 x 1.85 m machine, backlit product window behind glass, lit header, selection buttons and a card panel."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["vending_machine"]
outputs = ["assets/props/src/vending_machine.glb", "assets/props/src/vending_machine.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["vending_machine", "--no-run"]
outputs = ["scenes/props/scripts/vending_machine.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/vending_machine.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = ["noctis", "ramen"]
decals = [
  "assets/decals/props/meridian_sticker.png",
  "assets/decals/props/vend_flap.png",
  "assets/decals/props/vend_front_drinks.png",
  "assets/decals/props/vend_front_noctis.png",
  "assets/decals/props/vend_front_ramen.png",
  "assets/decals/props/vend_header_drinks.png",
  "assets/decals/props/vend_header_noctis.png",
  "assets/decals/props/vend_header_ramen.png",
  "assets/decals/props/vend_pay.png",
  "assets/decals/props/vend_side_drinks.png",
  "assets/decals/props/vend_side_noctis.png",
  "assets/decals/props/vend_side_ramen.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/poster_missing_ren.png",
]
outputs = [
  "scenes/props/projects/vending_machine.pigment",
  "scenes/props/textures/vending_machine",
  "scenes/props/textures/vending_machine__noctis",
  "scenes/props/textures/vending_machine__ramen",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["vending_machine", "--no-index"]
outputs = [
  "assets/props/vending_machine.glb",
  "assets/props/src/vending_machine_export.json",
  "assets/props/vending_machine_lod1.glb",
]
embed = 1024
lod1_ratio = 0.5

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 372
policy = "cell"
proxy = false
world_keys = ["PROP_vending_machine"]
visible_to_m = 150.0
collider = "box"
mount = "ground"
lights = [
  { name = "Light_Front", type = "omni", color = [0.75, 0.9, 1.0], energy = 25, range = 3.5 },
]
alpha = ["BLEND"]
lod = { lod0_tris = 372, lod1_tris = 186, lod1_from_m = 20.0, visible_to_m = 83.2 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 1079
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"

[placement.districts]
corporate = 5
downtown = 175
hillside = 119
midtown = 572
old_town = 145
port = 63

[placement.scatter]
slots = ["frontage", "alley"]
offset = 0.4
spacing = 6.0
clearance = 0.75
facing = "road"
yaw_jitter = 0
cluster = [1, 3]
cluster_radius = 0.0
cluster_line = true

[placement.scatter.density]
default = 1.5
commercial = 3.0
market = 3.0
residential = 2.0
slum = 2.0
luxury = 0.3
