# Smart model (prop/water_tank). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "water_tank"
kind = "prop"
title = "Rooftop water tank"
family = "street props kit"
category = "rooftop"
description = "Wooden stave tank with steel hoops and a conical roof on a steel stand, with a ladder."
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
  "placement.scatter",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/props/build_props.py"
args = ["water_tank"]
outputs = ["assets/props/src/water_tank.glb", "assets/props/src/water_tank.json"]
deps = [
  "tools/props/proplib.py",
  "tools/props/models_street.py",
  "tools/props/models_clutter.py",
  "tools/props/catalog.py",
]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/props/props_textures.py"
args = ["water_tank", "--no-run"]
outputs = ["scenes/props/scripts/water_tank.jsonl"]
mutable = ["scenes/props/textures/variants.json"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/props/scripts/water_tank.jsonl"]
textures = "scenes/props/textures"
resolution = 2048
variants = []
decals = ["assets/decals/props/stencil_water.png", "assets/decals/story/graffiti_unplug.png"]
outputs = ["scenes/props/projects/water_tank.pigment", "scenes/props/textures/water_tank"]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/props/export_props.py"
args = ["water_tank", "--no-index"]
outputs = [
  "assets/props/water_tank.glb",
  "assets/props/src/water_tank_export.json",
  "assets/props/water_tank_lod1.glb",
]
embed = 1024
lod1_ratio = 0.4

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "other"
collision = "none"
tris = 3280
policy = "cell"
proxy = false
world_keys = ["PROP_water_tank"]
visible_to_m = 150.0
collider = "cylinder"
mount = "ground"
lights = []
alpha = ["OPAQUE"]
lod = { lod0_tris = 3280, lod1_tris = 1311, lod1_from_m = 50.6, visible_to_m = 252.9 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 141
source = "tools/props/scatter.py (rules: tools/props/catalog.py)"
districts = { downtown = 79, midtown = 62 }

[placement.scatter]
slots = ["rooftop"]
spacing = 20.0
clearance = 2.0
facing = "random"
yaw_jitter = 180
density = { default = 0.3, residential = 0.5, slum = 0.6, industrial = 0.5, luxury = 0.0 }
