# Smart model (road_set/roads). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "roads"
kind = "road_set"
title = "Open-world road materials: seamless tiles, trim sheet, decal atlas"
family = "roads"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game.images",
]

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/road_textures.py"
args = []
outputs = [
  "scenes/town/scripts/roads/asphalt.jsonl",
  "scenes/town/scripts/roads/atlas.jsonl",
  "scenes/town/scripts/roads/concrete.jsonl",
  "scenes/town/scripts/roads/paving.jsonl",
  "scenes/town/scripts/roads/setts.jsonl",
  "scenes/town/scripts/roads/trim.jsonl",
  "assets/decals/roads",
]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = [
  "scenes/town/scripts/roads/asphalt.jsonl",
  "scenes/town/scripts/roads/atlas.jsonl",
  "scenes/town/scripts/roads/concrete.jsonl",
  "scenes/town/scripts/roads/paving.jsonl",
  "scenes/town/scripts/roads/setts.jsonl",
  "scenes/town/scripts/roads/trim.jsonl",
]
textures = "scenes/town/textures/roads"
resolution = 4096
variants = []
decals = [
  "assets/decals/roads/arrow_left.png",
  "assets/decals/roads/arrow_straight.png",
  "assets/decals/roads/bar.png",
  "assets/decals/roads/grate_frame.png",
  "assets/decals/roads/grate_slots.png",
  "assets/decals/roads/manhole_disc.png",
  "assets/decals/roads/manhole_pattern.png",
  "assets/decals/roads/manhole_rim.png",
  "assets/decals/roads/patch_a.png",
  "assets/decals/roads/patch_b.png",
  "assets/decals/roads/skid.png",
  "assets/decals/roads/soft_ellipse.png",
]
outputs = [
  "scenes/town/projects/roads/asphalt.pigment",
  "scenes/town/projects/roads/atlas.pigment",
  "scenes/town/projects/roads/concrete.pigment",
  "scenes/town/projects/roads/paving.pigment",
  "scenes/town/projects/roads/setts.pigment",
  "scenes/town/projects/roads/trim.pigment",
  "scenes/town/textures/roads/asphalt",
  "scenes/town/textures/roads/atlas",
  "scenes/town/textures/roads/concrete",
  "scenes/town/textures/roads/paving",
  "scenes/town/textures/roads/setts",
  "scenes/town/textures/roads/trim",
]
patch = []
decal_slots = {}

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "road"
collision = "trimesh"
images = [
  "images/asphalt_BaseColor.png",
  "images/atlas_BaseColorAlpha.png",
  "images/concrete_BaseColor.png",
  "images/facade_concrete_warm_BaseColor.png",
  "images/paving_BaseColor.png",
  "images/trim_BaseColor.png",
]
note = "road meshes are world pieces (tools/town_roads.py build_run); these are their materials"

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
source = "tools/world/network.py + world_gen.py (road classes in world_config.json)"
