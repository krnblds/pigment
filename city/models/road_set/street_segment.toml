# Smart model (road_set/street_segment). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "street_segment"
kind = "road_set"
title = "Legacy 20 m street segment (town map)"
family = "town kit"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
  "placement.instances",
  "placement.districts",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "assets/blender/town/street_segment.py"
args = ["assets/town/street_segment.glb"]
outputs = ["assets/town/street_segment.glb"]
deps = ["assets/blender/town/_kit.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "town_textures"
tool = "tools/town_textures.py"
job = "street_segment"
outputs = ["scenes/town/scripts/street_segment.jsonl"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/town/scripts/street_segment.jsonl"]
textures = "scenes/town/textures"
resolution = 4096
variants = []
decals = []
outputs = ["scenes/town/projects/street_segment.pigment", "scenes/town/textures/street_segment"]
patch = []
decal_slots = {}

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
instances = 0
source = "tools/world/placement.py"
rules = "street furniture along roads (world_config.json props)"
districts = {}
