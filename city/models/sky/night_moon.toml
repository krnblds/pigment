# Smart model (sky/night_moon). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "night_moon"
kind = "sky"
title = "Night sky preset night_moon"
family = "sky"
derived = []

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/sky/make_sky.py"
args = ["--presets", "night_moon", "--no-preview"]
outputs = ["assets/sky/night_moon_2k.hdr", "game/sky/night_moon_2k.hdr", "game/sky/sky_night_moon.tres"]
mutable = ["game/sky/sky_presets.json", "game/sky/sky_night.tscn"]
deps = []
params = {}

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "sky"
godot = "game/sky/sky_night_moon.tres"
light_hints = "city_sky.gd picks the largest imported HDR"
