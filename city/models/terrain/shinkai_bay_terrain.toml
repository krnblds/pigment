# Smart model (terrain/shinkai_bay_terrain). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "shinkai_bay_terrain"
kind = "terrain"
title = "Terrain: islands, mountains, erosion"
family = "world"
derived = ["terrain.islands", "terrain.chunks"]

[terrain]
world = "world/shinkai_bay"
section = "terrain"
islands = ["shinkai", "minato_port", "kagero_hills", "tenjin_corporate"]
chunks = 117

[terrain.settings]
cell_m = 2.0
erosion_cell_m = 8.0
sea_floor = -26.0
detail_m = 0.5
lod_cells_m = [2.0, 8.0, 32.0]
erosion = { thermal_iters = 80, talus_deg = 29.0, stream_iters = 4, stream_k = 0.0018 }

# Deep-merged into tools/world/world_config.json before the world is generated.
[config]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "terrain"
collision = "heightmap"
lod_cells_m = [2.0, 8.0, 32.0]
