# Smart model (tile_set/bridge_sheets): the Pigment sheets of the bridges (tools/world/bridge_kit.py,
# bridge_designs.py). Fields listed in model.derived are facts read from the pipeline and are refreshed
# by `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md, docs/agents/bridges/NOTES.md.

[model]
name = "bridge_sheets"
kind = "tile_set"
title = "Bridge sheets: weathered concrete, painted / weathering / grey steel, HDPE stay sheathing, Hoshikawa hoarding, hazard stripes"
family = "world"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
]

# Writes the Pigment scripts below (without running Pigment), plus the stencils / signs / light washes
# in assets/decals/bridges/.
[recipe]
runner = "python"
tool = "tools/world/bridge_textures.py"
args = ["--no-run"]
outputs = [
  "scenes/town/scripts/bridges/bridge_cable.jsonl",
  "scenes/town/scripts/bridges/bridge_concrete.jsonl",
  "scenes/town/scripts/bridges/bridge_hazard.jsonl",
  "scenes/town/scripts/bridges/bridge_hoarding.jsonl",
  "scenes/town/scripts/bridges/bridge_steel_grey.jsonl",
  "scenes/town/scripts/bridges/bridge_steel_weather.jsonl",
  "scenes/town/scripts/bridges/bridge_steel_white.jsonl",
]
mutable = ["assets/decals/bridges"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Rain streaks"}, set = {opacity = 0.7}}
[pigment]
scripts = [
  "scenes/town/scripts/bridges/bridge_cable.jsonl",
  "scenes/town/scripts/bridges/bridge_concrete.jsonl",
  "scenes/town/scripts/bridges/bridge_hazard.jsonl",
  "scenes/town/scripts/bridges/bridge_hoarding.jsonl",
  "scenes/town/scripts/bridges/bridge_steel_grey.jsonl",
  "scenes/town/scripts/bridges/bridge_steel_weather.jsonl",
  "scenes/town/scripts/bridges/bridge_steel_white.jsonl",
]
textures = "scenes/town/textures"
resolution = 2048
variants = []
decals = [
  "assets/decals/bridges/dot.png",
  "assets/decals/bridges/run.png",
  "assets/decals/bridges/sign_works.png",
  "assets/decals/logo_hoshikawa_dynamics.png",
  "assets/decals/roads/bar.png",
  "assets/decals/roads/patch_a.png",
  "assets/decals/roads/patch_b.png",
  "assets/decals/story/sign_hoshikawa_security.png",
]
outputs = [
  "scenes/town/projects/bridges/bridge_cable.pigment",
  "scenes/town/projects/bridges/bridge_concrete.pigment",
  "scenes/town/projects/bridges/bridge_hazard.pigment",
  "scenes/town/projects/bridges/bridge_hoarding.pigment",
  "scenes/town/projects/bridges/bridge_steel_grey.pigment",
  "scenes/town/projects/bridges/bridge_steel_weather.pigment",
  "scenes/town/projects/bridges/bridge_steel_white.pigment",
  "scenes/town/textures/bridge_cable",
  "scenes/town/textures/bridge_concrete",
  "scenes/town/textures/bridge_hazard",
  "scenes/town/textures/bridge_hoarding",
  "scenes/town/textures/bridge_steel_grey",
  "scenes/town/textures/bridge_steel_weather",
  "scenes/town/textures/bridge_steel_white",
]
patch = []
decal_slots = {}

# Game rules (Godot): the sheets are Pigment materials of the bridge meshes (godot.tex:bridge_*).
[game]
category = "material"
