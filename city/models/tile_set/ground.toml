# Smart model (tile_set/ground). Natural ground textures for the open-world terrain, authored in
# Pigment with the ground generators (cells, scatter, rock, blades, ripples; docs/agents/ground/NOTES.md).
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "ground"
kind = "tile_set"
title = "Ground sets: rock cliff, scree, forest floor, grass turf, dirt / mud, beach sand, cracked mud, cobbles, vacant lot"
family = "world"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
]

# Writes the Pigment scripts below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/ground_textures.py"
args = ["--no-run"]
outputs = [
  "scenes/world/scripts/ground/rock_cliff.jsonl",
  "scenes/world/scripts/ground/scree.jsonl",
  "scenes/world/scripts/ground/forest_floor.jsonl",
  "scenes/world/scripts/ground/grass_turf.jsonl",
  "scenes/world/scripts/ground/dirt_mud.jsonl",
  "scenes/world/scripts/ground/beach_sand.jsonl",
  "scenes/world/scripts/ground/cracked_mud.jsonl",
  "scenes/world/scripts/ground/cobbles.jsonl",
  "scenes/world/scripts/ground/vacant_lot.jsonl",
]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Lichen grey"}, set = {opacity = 0.4}}
[pigment]
scripts = [
  "scenes/world/scripts/ground/rock_cliff.jsonl",
  "scenes/world/scripts/ground/scree.jsonl",
  "scenes/world/scripts/ground/forest_floor.jsonl",
  "scenes/world/scripts/ground/grass_turf.jsonl",
  "scenes/world/scripts/ground/dirt_mud.jsonl",
  "scenes/world/scripts/ground/beach_sand.jsonl",
  "scenes/world/scripts/ground/cracked_mud.jsonl",
  "scenes/world/scripts/ground/cobbles.jsonl",
  "scenes/world/scripts/ground/vacant_lot.jsonl",
]
textures = "scenes/town/textures/world"
resolution = 4096
variants = []
decals = ["assets/decals/ground/tyre_track.png"]
outputs = [
  "scenes/world/projects/ground/rock_cliff.pigment",
  "scenes/world/projects/ground/scree.pigment",
  "scenes/world/projects/ground/forest_floor.pigment",
  "scenes/world/projects/ground/grass_turf.pigment",
  "scenes/world/projects/ground/dirt_mud.pigment",
  "scenes/world/projects/ground/beach_sand.pigment",
  "scenes/world/projects/ground/cracked_mud.pigment",
  "scenes/world/projects/ground/cobbles.pigment",
  "scenes/world/projects/ground/vacant_lot.pigment",
  "scenes/town/textures/world/rock_cliff",
  "scenes/town/textures/world/scree",
  "scenes/town/textures/world/forest_floor",
  "scenes/town/textures/world/grass_turf",
  "scenes/town/textures/world/dirt_mud",
  "scenes/town/textures/world/beach_sand",
  "scenes/town/textures/world/cracked_mud",
  "scenes/town/textures/world/cobbles",
  "scenes/town/textures/world/vacant_lot",
]
patch = []
decal_slots = {}

# Game rules (Godot): the terrain shader samples these as texture arrays (tools/godot/pack_ground.py,
# node godot.ground:world) with the world ground masks (tools/world/ground_masks.py, node ground:masks).
[game]
category = "material"
note = "terrain sets: Blender tools/world/ground_material.py, Godot game/scripts/terrain.gdshader"
