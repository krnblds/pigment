# Smart model (tile_set/interiors): the interior-mapped window rooms. Hand written; see
# docs/agents/interiors/NOTES.md and docs/CITY_BUILD.md.
#   mesh     headless Blender builds every room (tools/interiors/rooms.py) -> meshes/<room>.glb + .json
#   recipe   writes the Pigment scripts: one per room (materials, grime, wear, posters, emissive
#            screens / neon decals), the kit window maps and the atlas pack
#   pigment  runs them (pigment-mcp --script)
#   export   Cycles renders (lit / off / depth), Pigment pack_interiors, contact sheet, game copy

[model]
name = "interiors"
kind = "tile_set"
title = "Interior-mapped windows: 22 futuristic rooms + kit window maps"
family = "world"
