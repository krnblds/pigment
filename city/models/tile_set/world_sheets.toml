# Smart model (tile_set/world_sheets). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "world_sheets"
kind = "tile_set"
title = "World sheets: terrain tiles, tower facades, corrugated metal"
family = "world"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game.images",
]

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "town_textures_world"
tool = "tools/town_textures.py"
job = "world"
outputs = [
  "scenes/town/scripts/world/corrugated.jsonl",
  "scenes/town/scripts/world/dirt.jsonl",
  "scenes/town/scripts/world/facade_concrete_warm.jsonl",
  "scenes/town/scripts/world/facade_glass_blue.jsonl",
  "scenes/town/scripts/world/facade_glass_dark.jsonl",
  "scenes/town/scripts/world/facade_panel_cyan.jsonl",
  "scenes/town/scripts/world/grass.jsonl",
  "scenes/town/scripts/world/rock.jsonl",
  "scenes/town/scripts/world/sand.jsonl",
]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = [
  "scenes/town/scripts/world/corrugated.jsonl",
  "scenes/town/scripts/world/dirt.jsonl",
  "scenes/town/scripts/world/facade_concrete_warm.jsonl",
  "scenes/town/scripts/world/facade_glass_blue.jsonl",
  "scenes/town/scripts/world/facade_glass_dark.jsonl",
  "scenes/town/scripts/world/facade_panel_cyan.jsonl",
  "scenes/town/scripts/world/grass.jsonl",
  "scenes/town/scripts/world/rock.jsonl",
  "scenes/town/scripts/world/sand.jsonl",
]
textures = "scenes/town/textures/world"
resolution = 2048
variants = []
decals = ["assets/decals/roads/bar.png", "assets/decals/world/rib.png"]
outputs = [
  "scenes/town/projects/world/corrugated.pigment",
  "scenes/town/projects/world/dirt.pigment",
  "scenes/town/projects/world/facade_concrete_warm.pigment",
  "scenes/town/projects/world/facade_glass_blue.pigment",
  "scenes/town/projects/world/facade_glass_dark.pigment",
  "scenes/town/projects/world/facade_panel_cyan.pigment",
  "scenes/town/projects/world/grass.pigment",
  "scenes/town/projects/world/rock.pigment",
  "scenes/town/projects/world/sand.pigment",
  "scenes/town/textures/world/corrugated",
  "scenes/town/textures/world/dirt",
  "scenes/town/textures/world/facade_concrete_warm",
  "scenes/town/textures/world/facade_glass_blue",
  "scenes/town/textures/world/facade_glass_dark",
  "scenes/town/textures/world/facade_panel_cyan",
  "scenes/town/textures/world/grass",
  "scenes/town/textures/world/rock",
  "scenes/town/textures/world/sand",
]
patch = []
decal_slots = {}

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "material"
images = [
  "images/corrugated_BaseColor.png",
  "images/facade_concrete_warm_BaseColor.png",
  "images/facade_glass_blue_BaseColor.png",
  "images/facade_glass_dark_BaseColor.png",
  "images/facade_panel_cyan_BaseColor.png",
]
