# Smart model (vehicle/hakobi). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "hakobi"
kind = "vehicle"
title = "Ishimaru Hakobi LH-200 panel van"
family = "fleet"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/vehicles/build.py"
args = ["hakobi"]
outputs = [
  "assets/vehicles/hakobi/src/hakobi_body.glb",
  "assets/vehicles/hakobi/src/hakobi_wheel.glb",
  "assets/vehicles/hakobi/src/hakobi_parts.json",
  "assets/vehicles/hakobi/src/hakobi_info.json",
  "assets/vehicles/hakobi/src/hakobi_model.blend",
]
deps = ["tools/vehicles/vkit", "tools/vehicles/specs/hakobi.py", "tools/vehicles/fleet.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/vehicles/textures.py"
args = ["hakobi", "--no-run"]
outputs = [
  "scenes/vehicles/hakobi/scripts/hakobi_body.jsonl",
  "scenes/vehicles/hakobi/scripts/hakobi_wheel.jsonl",
]
deps = ["tools/vehicles/fleet.py"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = [
  "scenes/vehicles/hakobi/scripts/hakobi_body.jsonl",
  "scenes/vehicles/hakobi/scripts/hakobi_wheel.jsonl",
]
textures = "scenes/vehicles/hakobi/textures"
resolution = 2048
variants = ["white", "silver", "dreamlink", "noctis", "tsuru", "facilities", "ramen", "rusty"]
decals = [
  "assets/decals/car/caliper_logo.png",
  "assets/decals/car/gauges.png",
  "assets/decals/fleet/badge_hakobi.png",
  "assets/decals/fleet/band_hoshikawa.png",
  "assets/decals/fleet/band_hoshikawa_r.png",
  "assets/decals/fleet/band_tsuru.png",
  "assets/decals/fleet/band_tsuru_r.png",
  "assets/decals/fleet/dreamlink_logo.png",
  "assets/decals/fleet/dreamlink_side.png",
  "assets/decals/fleet/hd_facilities.png",
  "assets/decals/fleet/noctis_logo.png",
  "assets/decals/fleet/noctis_side.png",
  "assets/decals/fleet/plate_commercial_1.png",
  "assets/decals/fleet/plate_commercial_2.png",
  "assets/decals/fleet/plate_corp.png",
  "assets/decals/fleet/ramen_side.png",
  "assets/decals/fleet/tsuru_side.png",
  "assets/decals/fleet/tyre_hakobi.png",
  "assets/decals/story/billboard_score.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/graffiti_who_owns.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/vehicles/hakobi/projects/hakobi_body.pigment",
  "scenes/vehicles/hakobi/projects/hakobi_wheel.pigment",
  "scenes/vehicles/hakobi/textures/hakobi_body__dreamlink",
  "scenes/vehicles/hakobi/textures/hakobi_body__facilities",
  "scenes/vehicles/hakobi/textures/hakobi_body__noctis",
  "scenes/vehicles/hakobi/textures/hakobi_body__ramen",
  "scenes/vehicles/hakobi/textures/hakobi_body__rusty",
  "scenes/vehicles/hakobi/textures/hakobi_body__silver",
  "scenes/vehicles/hakobi/textures/hakobi_body__tsuru",
  "scenes/vehicles/hakobi/textures/hakobi_body__white",
  "scenes/vehicles/hakobi/textures/hakobi_wheel",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/vehicles/export.py"
args = ["hakobi"]
outputs = [
  "assets/vehicles/hakobi/hakobi.glb",
  "assets/vehicles/hakobi/hakobi_lod1.glb",
  "assets/vehicles/hakobi/hakobi_lod2.glb",
  "assets/vehicles/hakobi/hakobi.json",
]
mutable = ["assets/vehicles/index.json"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "vehicle"
collision = "convex"
class = "van"
spawn_weight = 1.4
player = false
variants = ["white", "silver", "dreamlink", "noctis", "tsuru", "facilities", "ramen", "rusty"]
lights = ["Headlight_L", "Headlight_R", "Taillight_L", "Taillight_R"]

[game.lod]
triangles = { lod0 = 70417, lod1 = 10679, lod2 = 1546 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
source = "game/scripts/traffic (spawn by spawn_weight, then variant weight)"
