# Smart model (vehicle/hayate). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "hayate"
kind = "vehicle"
title = "Kanzaki Hayate RS sports coupe"
family = "fleet"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/vehicles/build.py"
args = ["hayate"]
outputs = [
  "assets/vehicles/hayate/src/hayate_body.glb",
  "assets/vehicles/hayate/src/hayate_wheel.glb",
  "assets/vehicles/hayate/src/hayate_parts.json",
  "assets/vehicles/hayate/src/hayate_info.json",
  "assets/vehicles/hayate/src/hayate_model.blend",
]
deps = ["tools/vehicles/vkit", "tools/vehicles/specs/hayate.py", "tools/vehicles/fleet.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/vehicles/textures.py"
args = ["hayate", "--no-run"]
outputs = [
  "scenes/vehicles/hayate/scripts/hayate_body.jsonl",
  "scenes/vehicles/hayate/scripts/hayate_wheel.jsonl",
]
deps = ["tools/vehicles/fleet.py"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = [
  "scenes/vehicles/hayate/scripts/hayate_body.jsonl",
  "scenes/vehicles/hayate/scripts/hayate_wheel.jsonl",
]
textures = "scenes/vehicles/hayate/textures"
resolution = 2048
variants = ["purple", "red", "pearl_stripes", "lime", "gunmetal", "racing", "pursuit", "rusty"]
decals = [
  "assets/decals/car/caliper_logo.png",
  "assets/decals/car/gauges.png",
  "assets/decals/car/hs_crest.png",
  "assets/decals/car/hs_flash.png",
  "assets/decals/car/hs_flash_r.png",
  "assets/decals/car/hs_unit_roof.png",
  "assets/decals/car/meridian_linked.png",
  "assets/decals/fleet/badge_hayate.png",
  "assets/decals/fleet/hs_pursuit.png",
  "assets/decals/fleet/plate_hs_2.png",
  "assets/decals/fleet/plate_private_1.png",
  "assets/decals/fleet/plate_private_2.png",
  "assets/decals/fleet/plate_private_3.png",
  "assets/decals/fleet/racing_27.png",
  "assets/decals/fleet/roundel_27.png",
  "assets/decals/fleet/sponsor_jailbreak.png",
  "assets/decals/fleet/sponsor_kanzaki.png",
  "assets/decals/fleet/stripe_vermilion.png",
  "assets/decals/fleet/stripe_vermilion_r.png",
  "assets/decals/fleet/twin_stripes_black.png",
  "assets/decals/fleet/tyre_hayate.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/vehicles/hayate/projects/hayate_body.pigment",
  "scenes/vehicles/hayate/projects/hayate_wheel.pigment",
  "scenes/vehicles/hayate/textures/hayate_body__gunmetal",
  "scenes/vehicles/hayate/textures/hayate_body__lime",
  "scenes/vehicles/hayate/textures/hayate_body__pearl_stripes",
  "scenes/vehicles/hayate/textures/hayate_body__purple",
  "scenes/vehicles/hayate/textures/hayate_body__pursuit",
  "scenes/vehicles/hayate/textures/hayate_body__racing",
  "scenes/vehicles/hayate/textures/hayate_body__red",
  "scenes/vehicles/hayate/textures/hayate_body__rusty",
  "scenes/vehicles/hayate/textures/hayate_wheel",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/vehicles/export.py"
args = ["hayate"]
outputs = [
  "assets/vehicles/hayate/hayate.glb",
  "assets/vehicles/hayate/hayate_lod1.glb",
  "assets/vehicles/hayate/hayate_lod2.glb",
  "assets/vehicles/hayate/hayate.json",
]
mutable = ["assets/vehicles/index.json"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "vehicle"
collision = "convex"
class = "sports"
spawn_weight = 0.7
player = true
variants = ["purple", "red", "pearl_stripes", "lime", "gunmetal", "racing", "pursuit", "rusty"]
lights = ["Headlight_L", "Headlight_R", "Taillight_L", "Taillight_R"]

[game.lod]
triangles = { lod0 = 71290, lod1 = 10916, lod2 = 2295 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
source = "game/scripts/traffic (spawn by spawn_weight, then variant weight)"
