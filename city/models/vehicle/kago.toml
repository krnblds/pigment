# Smart model (vehicle/kago). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "kago"
kind = "vehicle"
title = "MERIDIAN Kago robotaxi pod"
family = "fleet"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/vehicles/build.py"
args = ["kago"]
outputs = [
  "assets/vehicles/kago/src/kago_body.glb",
  "assets/vehicles/kago/src/kago_wheel.glb",
  "assets/vehicles/kago/src/kago_parts.json",
  "assets/vehicles/kago/src/kago_info.json",
  "assets/vehicles/kago/src/kago_model.blend",
]
deps = ["tools/vehicles/vkit", "tools/vehicles/specs/kago.py", "tools/vehicles/fleet.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/vehicles/textures.py"
args = ["kago", "--no-run"]
outputs = ["scenes/vehicles/kago/scripts/kago_body.jsonl", "scenes/vehicles/kago/scripts/kago_wheel.jsonl"]
deps = ["tools/vehicles/fleet.py"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/vehicles/kago/scripts/kago_body.jsonl", "scenes/vehicles/kago/scripts/kago_wheel.jsonl"]
textures = "scenes/vehicles/kago/textures"
resolution = 2048
variants = ["meridian", "night", "dreamlink", "noctis", "patrol", "vandalized"]
decals = [
  "assets/decals/car/caliper_logo.png",
  "assets/decals/car/hs_flash.png",
  "assets/decals/car/hs_flash_r.png",
  "assets/decals/car/hs_unit_roof.png",
  "assets/decals/fleet/badge_kago.png",
  "assets/decals/fleet/dreamlink_logo.png",
  "assets/decals/fleet/dreamlink_side.png",
  "assets/decals/fleet/hs_patrol_pod.png",
  "assets/decals/fleet/meridian_ride.png",
  "assets/decals/fleet/meridian_ride_dark.png",
  "assets/decals/fleet/noctis_side.png",
  "assets/decals/fleet/plate_hs_2.png",
  "assets/decals/fleet/plate_meridian.png",
  "assets/decals/fleet/stripe_cyan.png",
  "assets/decals/fleet/stripe_cyan_r.png",
  "assets/decals/fleet/tyre_kago.png",
  "assets/decals/story/billboard_meridian.png",
  "assets/decals/story/billboard_score.png",
  "assets/decals/story/graffiti_lying.png",
  "assets/decals/story/graffiti_not_data.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/vehicles/kago/projects/kago_body.pigment",
  "scenes/vehicles/kago/projects/kago_wheel.pigment",
  "scenes/vehicles/kago/textures/kago_body__dreamlink",
  "scenes/vehicles/kago/textures/kago_body__meridian",
  "scenes/vehicles/kago/textures/kago_body__night",
  "scenes/vehicles/kago/textures/kago_body__noctis",
  "scenes/vehicles/kago/textures/kago_body__patrol",
  "scenes/vehicles/kago/textures/kago_body__vandalized",
  "scenes/vehicles/kago/textures/kago_wheel",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/vehicles/export.py"
args = ["kago"]
outputs = [
  "assets/vehicles/kago/kago.glb",
  "assets/vehicles/kago/kago_lod1.glb",
  "assets/vehicles/kago/kago_lod2.glb",
  "assets/vehicles/kago/kago.json",
]
mutable = ["assets/vehicles/index.json"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "vehicle"
collision = "convex"
class = "robotaxi"
spawn_weight = 1.2
player = false
variants = ["meridian", "night", "dreamlink", "noctis", "patrol", "vandalized"]
lights = ["Headlight_L", "Headlight_R", "Taillight_L", "Taillight_R"]

[game.lod]
triangles = { lod0 = 58649, lod1 = 10783, lod2 = 2531 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
source = "game/scripts/traffic (spawn by spawn_weight, then variant weight)"
