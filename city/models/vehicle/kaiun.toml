# Smart model (vehicle/kaiun). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "kaiun"
kind = "vehicle"
title = "Ishimaru Kaiun 2t box truck"
family = "fleet"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/vehicles/build.py"
args = ["kaiun"]
outputs = [
  "assets/vehicles/kaiun/src/kaiun_body.glb",
  "assets/vehicles/kaiun/src/kaiun_wheel.glb",
  "assets/vehicles/kaiun/src/kaiun_parts.json",
  "assets/vehicles/kaiun/src/kaiun_info.json",
  "assets/vehicles/kaiun/src/kaiun_model.blend",
]
deps = ["tools/vehicles/vkit", "tools/vehicles/specs/kaiun.py", "tools/vehicles/fleet.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/vehicles/textures.py"
args = ["kaiun", "--no-run"]
outputs = [
  "scenes/vehicles/kaiun/scripts/kaiun_body.jsonl",
  "scenes/vehicles/kaiun/scripts/kaiun_wheel.jsonl",
]
deps = ["tools/vehicles/fleet.py"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = [
  "scenes/vehicles/kaiun/scripts/kaiun_body.jsonl",
  "scenes/vehicles/kaiun/scripts/kaiun_wheel.jsonl",
]
textures = "scenes/vehicles/kaiun/textures"
resolution = 2048
variants = ["white", "logistics", "dreamlink", "noctis", "recycle", "tsuru", "rusty"]
decals = [
  "assets/decals/car/caliper_logo.png",
  "assets/decals/car/gauges.png",
  "assets/decals/fleet/badge_kaiun.png",
  "assets/decals/fleet/band_hoshikawa.png",
  "assets/decals/fleet/band_hoshikawa_r.png",
  "assets/decals/fleet/band_recycle.png",
  "assets/decals/fleet/band_recycle_r.png",
  "assets/decals/fleet/band_tsuru.png",
  "assets/decals/fleet/band_tsuru_r.png",
  "assets/decals/fleet/dreamlink_side.png",
  "assets/decals/fleet/hd_logistics.png",
  "assets/decals/fleet/noctis_side.png",
  "assets/decals/fleet/plate_commercial_1.png",
  "assets/decals/fleet/plate_commercial_2.png",
  "assets/decals/fleet/plate_corp.png",
  "assets/decals/fleet/recycle_side.png",
  "assets/decals/fleet/tsuru_side.png",
  "assets/decals/fleet/tyre_kaiun.png",
  "assets/decals/story/graffiti_lying.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/graffiti_who_owns.png",
]
outputs = [
  "scenes/vehicles/kaiun/projects/kaiun_body.pigment",
  "scenes/vehicles/kaiun/projects/kaiun_wheel.pigment",
  "scenes/vehicles/kaiun/textures/kaiun_body__dreamlink",
  "scenes/vehicles/kaiun/textures/kaiun_body__logistics",
  "scenes/vehicles/kaiun/textures/kaiun_body__noctis",
  "scenes/vehicles/kaiun/textures/kaiun_body__recycle",
  "scenes/vehicles/kaiun/textures/kaiun_body__rusty",
  "scenes/vehicles/kaiun/textures/kaiun_body__tsuru",
  "scenes/vehicles/kaiun/textures/kaiun_body__white",
  "scenes/vehicles/kaiun/textures/kaiun_wheel",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/vehicles/export.py"
args = ["kaiun"]
outputs = [
  "assets/vehicles/kaiun/kaiun.glb",
  "assets/vehicles/kaiun/kaiun_lod1.glb",
  "assets/vehicles/kaiun/kaiun_lod2.glb",
  "assets/vehicles/kaiun/kaiun.json",
]
mutable = ["assets/vehicles/index.json"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "vehicle"
collision = "convex"
class = "truck"
spawn_weight = 0.7
player = false
variants = ["white", "logistics", "dreamlink", "noctis", "recycle", "tsuru", "rusty"]
lights = ["Headlight_L", "Headlight_R", "Taillight_L", "Taillight_R"]

[game.lod]
triangles = { lod0 = 72972, lod1 = 12520, lod2 = 1965 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
source = "game/scripts/traffic (spawn by spawn_weight, then variant weight)"
