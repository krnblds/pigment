# Smart model (vehicle/mame). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "mame"
kind = "vehicle"
title = "Kanzaki Mame K3 kei hatchback"
family = "fleet"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/vehicles/build.py"
args = ["mame"]
outputs = [
  "assets/vehicles/mame/src/mame_body.glb",
  "assets/vehicles/mame/src/mame_wheel.glb",
  "assets/vehicles/mame/src/mame_parts.json",
  "assets/vehicles/mame/src/mame_info.json",
  "assets/vehicles/mame/src/mame_model.blend",
]
deps = ["tools/vehicles/vkit", "tools/vehicles/specs/mame.py", "tools/vehicles/fleet.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/vehicles/textures.py"
args = ["mame", "--no-run"]
outputs = ["scenes/vehicles/mame/scripts/mame_body.jsonl", "scenes/vehicles/mame/scripts/mame_wheel.jsonl"]
deps = ["tools/vehicles/fleet.py"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = ["scenes/vehicles/mame/scripts/mame_body.jsonl", "scenes/vehicles/mame/scripts/mame_wheel.jsonl"]
textures = "scenes/vehicles/mame/textures"
resolution = 2048
variants = ["cream", "mint", "cherry", "sky", "silver", "tsuru", "inspector", "rusty"]
decals = [
  "assets/decals/car/caliper_logo.png",
  "assets/decals/car/gauges.png",
  "assets/decals/fleet/badge_mame.png",
  "assets/decals/fleet/meridian_eye_ink.png",
  "assets/decals/fleet/meridian_inspector.png",
  "assets/decals/fleet/plate_commercial_2.png",
  "assets/decals/fleet/plate_kei_1.png",
  "assets/decals/fleet/plate_kei_2.png",
  "assets/decals/fleet/plate_meridian.png",
  "assets/decals/fleet/rusty_for_sale.png",
  "assets/decals/fleet/stripe_cyan.png",
  "assets/decals/fleet/stripe_cyan_r.png",
  "assets/decals/fleet/tsuru_side.png",
  "assets/decals/fleet/tyre_mame.png",
  "assets/decals/story/graffiti_unplug.png",
]
outputs = [
  "scenes/vehicles/mame/projects/mame_body.pigment",
  "scenes/vehicles/mame/projects/mame_wheel.pigment",
  "scenes/vehicles/mame/textures/mame_body__cherry",
  "scenes/vehicles/mame/textures/mame_body__cream",
  "scenes/vehicles/mame/textures/mame_body__inspector",
  "scenes/vehicles/mame/textures/mame_body__mint",
  "scenes/vehicles/mame/textures/mame_body__rusty",
  "scenes/vehicles/mame/textures/mame_body__silver",
  "scenes/vehicles/mame/textures/mame_body__sky",
  "scenes/vehicles/mame/textures/mame_body__tsuru",
  "scenes/vehicles/mame/textures/mame_wheel",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/vehicles/export.py"
args = ["mame"]
outputs = [
  "assets/vehicles/mame/mame.glb",
  "assets/vehicles/mame/mame_lod1.glb",
  "assets/vehicles/mame/mame_lod2.glb",
  "assets/vehicles/mame/mame.json",
]
mutable = ["assets/vehicles/index.json"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "vehicle"
collision = "convex"
class = "kei"
spawn_weight = 2.2
player = false
variants = ["cream", "mint", "cherry", "sky", "silver", "tsuru", "inspector", "rusty"]
lights = ["Headlight_L", "Headlight_R", "Taillight_L", "Taillight_R"]

[game.lod]
triangles = { lod0 = 62713, lod1 = 10100, lod2 = 1242 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
source = "game/scripts/traffic (spawn by spawn_weight, then variant weight)"
