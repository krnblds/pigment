# Smart model (vehicle/tsubame). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "tsubame"
kind = "vehicle"
title = "Kanzaki Tsubame-4, Hoshikawa Security cruiser"
family = "fleet"
derived = [
  "pigment.variants",
  "pigment.decals",
  "pigment.decal_slots",
  "pigment.outputs",
  "pigment.resolution",
  "game",
]

# Geometry. params are passed to the generator as $CITY_PARAMS (JSON).
[mesh]
runner = "blender"
generator = "tools/vehicles/build.py"
args = ["tsubame"]
outputs = [
  "assets/vehicles/tsubame/src/tsubame_body.glb",
  "assets/vehicles/tsubame/src/tsubame_wheel.glb",
  "assets/vehicles/tsubame/src/tsubame_parts.json",
  "assets/vehicles/tsubame/src/tsubame_info.json",
  "assets/vehicles/tsubame/src/tsubame_model.blend",
]
deps = ["tools/vehicles/vkit", "tools/vehicles/specs/tsubame.py", "tools/vehicles/fleet.py"]
params = {}

# Writes the Pigment script below (without running Pigment).
[recipe]
runner = "python"
tool = "tools/vehicles/textures.py"
args = ["tsubame", "--no-run"]
outputs = [
  "scenes/vehicles/tsubame/scripts/tsubame_body.jsonl",
  "scenes/vehicles/tsubame/scripts/tsubame_wheel.jsonl",
]
deps = ["tools/vehicles/fleet.py"]

# Pigment scripts run with pigment-mcp --script. patch ops are applied to the script first:
#   {match = {tool = "add_layer", name = "Concrete"}, set = {opacity = 0.8}}
[pigment]
scripts = [
  "scenes/vehicles/tsubame/scripts/tsubame_body.jsonl",
  "scenes/vehicles/tsubame/scripts/tsubame_wheel.jsonl",
]
textures = "scenes/vehicles/tsubame/textures"
resolution = 2048
variants = ["security", "cab", "pearl", "maroon", "gunmetal", "exec", "hinode", "rusty"]
decals = [
  "assets/decals/car/badge_tsubame.png",
  "assets/decals/car/cab_door.png",
  "assets/decals/car/cab_flash.png",
  "assets/decals/car/cab_flash_r.png",
  "assets/decals/car/cab_number.png",
  "assets/decals/car/caliper_logo.png",
  "assets/decals/car/gauges.png",
  "assets/decals/car/hs_crest.png",
  "assets/decals/car/hs_door_dark.png",
  "assets/decals/car/hs_flash.png",
  "assets/decals/car/hs_flash_r.png",
  "assets/decals/car/hs_unit.png",
  "assets/decals/car/hs_unit_roof.png",
  "assets/decals/car/meridian_linked.png",
  "assets/decals/car/plate_cab.png",
  "assets/decals/car/plate_hs.png",
  "assets/decals/car/shock_warning.png",
  "assets/decals/car/tyre_ring.png",
  "assets/decals/fleet/hd_door_exec.png",
  "assets/decals/fleet/hinode_door.png",
  "assets/decals/fleet/hinode_number.png",
  "assets/decals/fleet/meridian_eye_cyan.png",
  "assets/decals/fleet/plate_commercial_1.png",
  "assets/decals/fleet/plate_corp.png",
  "assets/decals/fleet/plate_private_1.png",
  "assets/decals/fleet/plate_private_2.png",
  "assets/decals/fleet/plate_private_3.png",
  "assets/decals/fleet/rusty_for_sale.png",
  "assets/decals/fleet/stripe_cream.png",
  "assets/decals/fleet/stripe_cream_r.png",
  "assets/decals/story/billboard_score.png",
  "assets/decals/story/graffiti_unplug.png",
  "assets/decals/story/stencil_eye_crossed.png",
]
outputs = [
  "scenes/vehicles/tsubame/projects/tsubame_body.pigment",
  "scenes/vehicles/tsubame/projects/tsubame_wheel.pigment",
  "scenes/vehicles/tsubame/textures/tsubame_body__cab",
  "scenes/vehicles/tsubame/textures/tsubame_body__exec",
  "scenes/vehicles/tsubame/textures/tsubame_body__gunmetal",
  "scenes/vehicles/tsubame/textures/tsubame_body__hinode",
  "scenes/vehicles/tsubame/textures/tsubame_body__maroon",
  "scenes/vehicles/tsubame/textures/tsubame_body__pearl",
  "scenes/vehicles/tsubame/textures/tsubame_body__rusty",
  "scenes/vehicles/tsubame/textures/tsubame_body__security",
  "scenes/vehicles/tsubame/textures/tsubame_wheel",
]
patch = []
decal_slots = {}

# Game export of the textured asset.
[export]
runner = "blender"
tool = "tools/vehicles/export.py"
args = ["tsubame"]
outputs = [
  "assets/vehicles/tsubame/tsubame.glb",
  "assets/vehicles/tsubame/tsubame_lod1.glb",
  "assets/vehicles/tsubame/tsubame_lod2.glb",
  "assets/vehicles/tsubame/tsubame.json",
  "assets/car/car.glb",
  "assets/car/car_lod1.glb",
  "assets/car/car.json",
]
mutable = ["assets/vehicles/index.json"]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
category = "vehicle"
collision = "convex"
class = "sedan"
spawn_weight = 1.0
player = true
variants = ["security", "cab", "pearl", "maroon", "gunmetal", "exec", "hinode", "rusty"]
lights = ["Headlight_L", "Headlight_R", "Taillight_L", "Taillight_R"]

[game.lod]
triangles = { lod0 = 92458, lod1 = 9914, lod2 = 2768 }

# Where the world places it (read from scenes/world/world.json; scatter rules live in the props catalog).
[placement]
source = "game/scripts/traffic (spawn by spawn_weight, then variant weight)"
