# Smart model (world/shinkai_bay). Generated by `python -m tools.city discover`; edit freely.
# Fields listed in model.derived are facts read from the pipeline and are refreshed by
# `city discover --refresh`; everything else is kept. See docs/CITY_BUILD.md.

[model]
name = "shinkai_bay"
kind = "world"
title = "The open world: 4 x 4 km bay, four islands"
family = "world"
derived = ["world.metrics", "world.chunks"]

[world]
config = "tools/world/world_config.json"
seed = 2077
out = "scenes/world"
export_dir = "game/assets/world"
chunk_m = 256
chunks = 117

[world.metrics]
land_km2 = 4.85
road_km_total = 32.24
roads = 263
junctions = 156
signals = 265
bridges = 6
decks = 27
towers = 255
terrain_chunks = 117
summit_m = 268.2

# Deep-merged into tools/world/world_config.json before the world is generated.
[config]

# Game rules (Godot): collision, streaming policy, LOD / proxy, lights.
[game]
layout = "game/assets/world/world_layout.json"
loader = "game/scripts/town_loader.gd"
policies = "cell / heavy (+ far proxies) / region / merge / single, see docs/agents/perf/NOTES.md"
