[package]
name = "pigment"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pigment-core = { path = "../core" }
glam.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
rfd = "0.17"
log = "0.4"
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "hdr", "exr", "jpeg"] }
env_logger = "0.11"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
