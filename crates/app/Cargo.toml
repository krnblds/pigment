[package]
name = "pigment"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pigment_engine"
path = "src/lib.rs"

[[bin]]
name = "pigment"
path = "src/main.rs"

[[bin]]
name = "pigment-mcp"
path = "src/bin/pigment-mcp.rs"

[dependencies]
pigment-core = { path = "../core" }
glam.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
rfd = "0.17"
log = "0.4"
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "hdr", "exr", "jpeg"] }
env_logger = "0.11"
pollster = "1"
serde_json.workspace = true
serde.workspace = true
base64 = "0.22"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
